<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mantas FJR Solutions</title>
<meta name="description" content="Catálogo e estoque de mantas da FJR Solutions: rolos, cortes de tapetes e sobras.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: vitrine escura como o catálogo da FJR — logo central, grade de rolos com nome na cor da manta; páginas de item com coluna principal + coluna lateral */
:root{
  color-scheme:dark;
  --bg:#050608; --surface:#101318; --surface-2:#161a21; --hover:#1b2029; --ink:#F1F3F7; --muted:#99A1B1; --line:#252b36;
  --accent:#F2552C; --accent-ink:#FF7C57; --accent-soft:rgba(242,85,44,.15); --on-accent:#FFFFFF;
  --ok:#5CCB93; --ok-bg:rgba(92,203,147,.13); --warn:#E9B04F; --warn-bg:rgba(233,176,79,.13); --bad:#F27A7A; --bad-bg:rgba(242,122,122,.13);
  --piece:#22385F; --piece-line:#8FB0EA; --waste:#465165;
  --glow-blue:rgba(32,70,220,.30); --glow-red:rgba(225,45,30,.26);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(55% 45% at 0% 0%,var(--glow-blue),transparent 70%),radial-gradient(45% 45% at 100% 0%,var(--glow-red),transparent 70%),radial-gradient(45% 45% at 0% 100%,var(--glow-red),transparent 70%),radial-gradient(55% 45% at 100% 100%,var(--glow-blue),transparent 70%),var(--bg);background-attachment:fixed}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:1.8rem;letter-spacing:.02em;text-transform:uppercase}
h2{font-size:1rem;font-weight:600}
p{margin:0}
a{color:inherit}
img{max-width:100%}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(5,6,8,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:22px;height:60px}
.top .logo{height:30px;display:block}
.navs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.navs::-webkit-scrollbar{display:none}
.nav{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
.nav:hover{color:var(--ink);background:var(--hover)}
.nav[aria-current="page"]{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--accent)}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:.84rem;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}.dot.local{background:var(--warn)}
#savebar{position:fixed;top:0;left:0;right:0;z-index:30;background:#0b0d12;border-bottom:1px solid var(--accent);padding-top:env(safe-area-inset-top,0px)}
.sb-in{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sb-in span{font-weight:500;display:flex;align-items:center;gap:8px}
.sb-in span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sb-in div{display:flex;gap:8px}
main{padding-block:24px 90px}
.page{display:flex;flex-direction:column;gap:16px}
.page.narrow{max-width:860px;margin:0 auto}
.notice{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(233,176,79,.25);border-radius:10px;padding:9px 12px;font-size:.86rem}

/* vitrine */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:18px 6px}
.hero img{height:86px;width:auto}
.hero p{color:var(--muted)}
.hero .sum{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1;min-width:200px;max-width:340px}
.toolbar .acts{margin-left:auto;display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 16px}
.pcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;border-radius:14px;padding:8px 8px 12px;border:1px solid transparent;transition:border-color .15s,background .15s,transform .15s}
.pcard:hover{background:var(--surface);border-color:var(--line);transform:translateY(-2px)}
.pcard .pic{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.pcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pic svg{width:78%;height:auto}
.pname{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:.03em;text-transform:uppercase;text-align:center;color:var(--c);line-height:1.1}
.pstock{display:flex;justify-content:center;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);text-align:center;flex-wrap:wrap}
.pstock .dot{flex:none}

/* cabeçalho de página */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;text-decoration:none;border:1px solid var(--line);background:var(--surface)}
.back:hover{border-color:var(--muted)}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumb{font-size:.86rem;color:var(--muted);width:100%;padding-left:46px;margin-top:-6px}

/* cartões */
.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.cb{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.cb.flush{padding:10px 0 0}
.ch a,.link{color:var(--accent-ink);font-weight:500;font-size:.88rem;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.ch a:hover,.link:hover{text-decoration:underline}
.photo{border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:60%;height:auto}

/* botões e campos */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.9rem;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{border-color:var(--accent-ink);background:var(--accent-ink)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#160606}
.btn-ghost-danger{color:var(--bad)}
.btn-block{width:100%}
.btn-sm{padding:5px 10px;font-size:.84rem}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.84rem;font-weight:500}
.field small{color:var(--muted);font-size:.8rem}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
.input:disabled{color:var(--muted)}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=color].input{padding:3px;height:38px;cursor:pointer}
.dims{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.dims .x{padding-bottom:8px;color:var(--muted);font-family:var(--f-mono)}
.dims .input{font-family:var(--f-mono);font-size:1.05rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:.82rem;cursor:pointer}
.chip.mono{font-family:var(--f-mono);font-size:.78rem}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* listas */
.tabs{display:flex;gap:4px;padding:10px 12px 0;flex-wrap:wrap}
.tab{appearance:none;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted);font-size:.88rem}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.filters .input{max-width:320px}
.filters .dims{max-width:260px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.78rem;color:var(--muted);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr[data-href]{cursor:pointer}
tr[data-href]:hover td{background:var(--hover)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td a.t{font-weight:600;text-decoration:none}
td a.t:hover{text-decoration:underline}
.nowrap{white-space:nowrap}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:1rem}

/* peças pequenas */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--f-body);letter-spacing:0;text-transform:none}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.ok{background:var(--ok-bg);color:var(--ok);box-shadow:none}
.pill.hot{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.pill.warn{background:var(--warn-bg);color:var(--warn);box-shadow:none}
.pill.bad{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.thumb{width:44px;height:33px;border-radius:6px;overflow:hidden;background:#000;display:inline-flex;align-items:center;justify-content:center;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:90%}
.prod{display:flex;align-items:center;gap:12px;min-width:0}
.prod div{min-width:0}
.prod small{display:block;color:var(--muted);font-size:.8rem}
.cname{font-family:var(--f-display);font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--c)}
.bar{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--line);min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:4px}
.mini{width:52px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:6px;flex:none}
.mini rect,.bigpic rect{fill:var(--piece);stroke:var(--piece-line);stroke-width:1.5;stroke-dasharray:4 2}
.bigpic{background:var(--surface-2);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:14px}
.kv{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.kv li{display:flex;justify-content:space-between;gap:12px;font-size:.9rem}
.kv li span:first-child{color:var(--muted)}
.kv li b{font-family:var(--f-mono);font-weight:500;text-align:right}
.divider{border-top:1px solid var(--line);margin:0 -16px}
.msg{padding:12px;border-radius:8px;font-size:.9rem;background:var(--surface-2);color:var(--muted)}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg b{color:var(--ink)}
.msg.err b{color:var(--bad)}

/* plano de corte */
.plan-wrap{overflow-x:auto;background:var(--surface-2);border-radius:8px;padding:10px}
.plan{display:block;max-width:100%;height:auto;margin:0 auto}
.plan .rug{fill:var(--accent)}
.plan .keep{fill:var(--piece);stroke:var(--piece-line);stroke-width:1.5;stroke-dasharray:5 3}
.plan .ctx{fill:var(--bg);stroke:var(--line)}
.plan .used{fill:var(--waste)}
.plan .hb{fill:var(--bg)}
.plan .hl{stroke:var(--waste);stroke-width:3}
.plan .cut{stroke:var(--bg);stroke-width:1.5}
.plan text{fill:var(--ink);font:500 12px var(--f-mono)}
.plan text.on{fill:var(--on-accent)}
.plan text.dim{fill:var(--muted);font-size:11px}
.plan .dl,.plan .tick{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.l-rug{background:var(--accent)}
.l-keep{background:var(--piece);border:1px dashed var(--piece-line)}
.l-lose{background:repeating-linear-gradient(45deg,var(--waste) 0 2px,var(--bg) 2px 5px)}
.l-used{background:var(--waste)}
.srcs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.src{appearance:none;display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;width:100%}
.src:first-child{border-top:0}
.src:hover{background:var(--hover)}
.src[aria-checked="true"]{background:var(--accent-soft)}
.src .radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;background:var(--bg)}
.src[aria-checked="true"] .radio{border-color:var(--accent);background:radial-gradient(var(--accent) 0 3px,var(--bg) 4px)}
.src .t{flex:1;min-width:0}
.src .t b{font-weight:600}
.src .t small{display:block;color:var(--muted);font-size:.8rem}
.src .r{font-family:var(--f-mono);font-size:.84rem;white-space:nowrap;text-align:right}

/* modal e aviso */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
dialog header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog header h3{font-size:1rem}
dialog .x{appearance:none;border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.dlg-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.form-err:empty{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#F1F3F7;color:#0b0d12;padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--bad);color:#160606}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .top .wrap{gap:12px}
  .who .em{display:none}
}
@media (max-width:560px){
  .top .wrap{flex-wrap:wrap;height:auto;padding-block:8px;row-gap:4px}
  .navs{order:3;flex-basis:100%}
  .who{margin-left:auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
  .pname{font-size:1rem}
  .hero img{height:60px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .hide-sm{display:none}
  .ph .acts{margin-left:0;width:100%}
  .crumb{padding-left:0;margin-top:0}
  .toolbar .acts{margin-left:0}
}
@media (prefers-reduced-motion:reduce){#toast,.pcard{transition:none}.pcard:hover{transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="#catalogo" aria-label="Catálogo"><img class="logo" src="img/logo.png" alt="FJR Solutions"></a>
  <nav class="navs" aria-label="Menu">
    <a class="nav" href="#catalogo" data-nav="catalogo">Catálogo</a>
    <a class="nav" href="#pedidos" data-nav="pedidos" id="navPedidos">Pedidos</a>
    <a class="nav" href="#sobras" data-nav="sobras">Sobras</a>
    <a class="nav" href="#regras" data-nav="regras">Regras de corte</a>
  </nav>
  <div class="who" id="who"><i class="dot"></i>Conectando…</div>
</div></header>
<div id="savebar" hidden><div class="wrap sb-in"><span>Alterações não salvas</span><div><button class="btn" data-act="descartar-edicao">Descartar</button><button class="btn btn-primary" data-act="salvar-edicao">Salvar</button></div></div></div>
<main class="wrap" id="app"><div class="loading">Carregando…</div></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fotoFile" accept="image/*" hidden>

<script src="config.js"></script>
<script>
(() => {
const EPS = 0.001;
const DEF = { sobraMin: 0.30, larguraPadrao: 1.20, comprimentoPadrao: 12 };
const COLS = ['materiais', 'mantas', 'sobras', 'config'];
const CATALOGO = [
  ['grafite', 'Manta Grafite', '#9A9DA3'], ['vermelha', 'Manta Vermelha', '#F0362B'], ['azul-royal', 'Manta Azul Royal', '#3B6CFF'],
  ['verde', 'Manta Verde', '#1FA866'], ['laranja', 'Manta Laranja', '#FF8A22'], ['bordo', 'Manta Bordô', '#E0406E'],
  ['pink', 'Manta Pink', '#FF45B0'], ['rosa-bebe', 'Manta Rosa Bebê', '#F7A3CF'], ['roxo', 'Manta Roxo', '#A24BFF'],
  ['azul-marinho', 'Manta Azul Marinho', '#4E6FD8'], ['azul-maritimo', 'Manta Azul Marítimo', '#22A6F5'], ['verde-floresta', 'Manta Verde Floresta', '#22A06F'],
  ['verde-musgo', 'Manta Verde Musgo', '#8EE02E'], ['verde-piscina', 'Manta Verde Piscina', '#2CD3E0'], ['preto', 'Manta Preto', '#E6E8EC'],
  ['cinza', 'Manta Cinza', '#A9ACB1'], ['marrom', 'Manta Marrom', '#C47A45'], ['bege', 'Manta Bege', '#E3CDA4'],
];
const S = {
  materiais: [], mantas: [], sobras: [], movimentos: [], config: {},
  loaded: new Set(), mode: 'loading', authUser: null, route: { page: 'catalogo' }, busy: false, dirty: null, pending: false, seeding: false,
  ui: {
    cat: { q: '', f: 'todos' }, produto: { tab: 'ativas' },
    np: { mat: '', a: '', b: '', cliente: '', pedido: '', sel: null },
    pedidos: { tab: 'todos', q: '' }, sobras: { tab: 'disponivel', a: '', b: '' },
  },
};
let store = null, unsubMov = null;
const canWrite = () => S.mode === 'local' || (S.mode === 'firebase' && !!S.authUser);
const canSeePedidos = () => S.mode !== 'firebase' || !!S.authUser;

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- armazenamento ---------- */
async function firebaseStore(conf) {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [app, fs, au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
  const a = app.initializeApp(conf);
  const db = fs.initializeFirestore(a, { ignoreUndefinedProperties: true });
  const auth = au.getAuth(a);
  return {
    auth, au,
    sub: (col, cb, err) => fs.onSnapshot(fs.collection(db, col), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err),
    set: (col, id, d) => fs.setDoc(fs.doc(db, col, id), d),
    update: (col, id, d) => fs.updateDoc(fs.doc(db, col, id), d),
    del: (col, id) => fs.deleteDoc(fs.doc(db, col, id)),
  };
}
function localStore() {
  const KEY = 'fjr-estoque-site-v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
  const subs = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('O navegador não deixou salvar (espaço cheio?).', 'bad'); } };
  const emit = col => { const list = Object.entries(data[col] || {}).map(([id, d]) => ({ id, ...d })); (subs[col] || []).forEach(cb => cb(list)); };
  const clone = d => JSON.parse(JSON.stringify(d));
  return {
    sub(col, cb) { (subs[col] ||= []).push(cb); queueMicrotask(() => emit(col)); return () => { subs[col] = (subs[col] || []).filter(f => f !== cb); }; },
    async set(col, id, d) { (data[col] ||= {})[id] = clone(d); save(); emit(col); },
    async update(col, id, d) { if (!data[col]?.[id]) throw { code: 'not-found', message: 'registro não encontrado' }; data[col][id] = { ...data[col][id], ...clone(d) }; save(); emit(col); },
    async del(col, id) { if (data[col]) delete data[col][id]; save(); emit(col); },
  };
}
async function write(fn) {
  if (!canWrite()) { toast('Entre com sua conta para editar.', 'bad'); return false; }
  if (S.busy) return false;
  S.busy = true;
  try { await fn(); return true; }
  catch (e) {
    const msg = e?.code === 'permission-denied' ? 'Sem permissão para salvar. Entre com uma conta da equipe.'
      : e?.code === 'resource-exhausted' ? 'Limite do banco de dados atingido. Tente mais tarde.'
      : 'Não foi possível salvar: ' + (e?.message || e);
    toast(msg, 'bad'); return false;
  } finally { S.busy = false; }
}

/* ---------- geometria do corte ----------
   "atravessado" = largura da manta (1,20 m); "ao longo" = comprimento do rolo.
   Peça: {a0, l0, w (atravessado), l (ao longo)} */
function splitPieces(pieces) {
  const keep = [], lose = [];
  pieces.filter(p => p.w > EPS && p.l > EPS).forEach(p => (usable(p.w, p.l) ? keep : lose).push({ ...p, w: r3(p.w), l: r3(p.l) }));
  return { keep, lose, waste: r3(sum(lose, p => p.w * p.l)) };
}
const orientations = (a, b) => Math.abs(a - b) < EPS ? [[a, b]] : [[a, b], [b, a]];
function fitRoll(m, a, b) {
  const W = m.largura, R = restante(m), out = [];
  for (const [x, y] of orientations(a, b)) {
    if (x > W + EPS || y > R + EPS) continue;
    out.push({ x, y, consumo: y, regionW: W, regionL: y, ...splitPieces([{ a0: x, l0: 0, w: W - x, l: y }]) });
  }
  return out.sort((p, q) => p.waste - q.waste || p.consumo - q.consumo)[0] || null;
}
function fitSobra(s, a, b) {
  const w = s.largura, l = s.comprimento, out = [];
  for (const [x, y] of orientations(a, b)) {
    if (x > w + EPS || y > l + EPS) continue;
    out.push({ x, y, consumo: 0, regionW: w, regionL: l, ...splitPieces([{ a0: x, l0: 0, w: w - x, l: y }, { a0: 0, l0: y, w, l: l - y }]) });
    out.push({ x, y, consumo: 0, regionW: w, regionL: l, ...splitPieces([{ a0: x, l0: 0, w: w - x, l }, { a0: 0, l0: y, w: x, l: l - y }]) });
  }
  const big = o => Math.max(0, ...o.keep.map(p => p.w * p.l));
  return out.sort((p, q) => p.waste - q.waste || big(q) - big(p) || p.keep.length - q.keep.length)[0] || null;
}
function recommend(mat, a, b) {
  const sob = S.sobras.filter(s => s.status === 'disponivel' && s.materialId === mat)
    .map(s => ({ tipo: 'sobra', src: s, o: fitSobra(s, a, b) })).filter(c => c.o).sort((p, q) => area(p.src) - area(q.src));
  const ab = S.mantas.filter(m => m.materialId === mat && stManta(m) === 'aberta')
    .map(m => ({ tipo: 'manta', src: m, o: fitRoll(m, a, b) })).filter(c => c.o).sort((p, q) => restante(p.src) - restante(q.src));
  const fe = S.mantas.filter(m => m.materialId === mat && stManta(m) === 'fechada')
    .sort((p, q) => String(p.entrada).localeCompare(String(q.entrada)) || String(p.codigo).localeCompare(String(q.codigo)))
    .map(m => ({ tipo: 'manta', fechada: true, src: m, o: fitRoll(m, a, b) })).filter(c => c.o);
  const list = [...sob, ...ab];
  if (fe.length) list.push({ ...fe[0], outras: fe.length - 1 });
  list.forEach(c => { c.key = c.tipo + ':' + c.src.id; });
  return list;
}

/* ---------- desenhos ---------- */
let svgN = 0;
const hatch = id => `<defs><pattern id="${id}" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect class="hb" width="7" height="7"/><line class="hl" x1="0" y1="0" x2="0" y2="7"/></pattern></defs>`;
function drawPlan({ W, L, rug, rugLabel, keep = [], lose = [], maxW = 560, maxH = 170 }) {
  const id = 'h' + (++svgN), k = Math.min(maxW / L, maxH / W);
  const pl = 34, pt = 8, pb = 28, pr = 8, vw = pl + L * k + pr, vh = pt + W * k + pb;
  const R = (p, cls) => `<rect class="${cls}" x="${(pl + p.l0 * k).toFixed(1)}" y="${(pt + p.a0 * k).toFixed(1)}" width="${(p.l * k).toFixed(1)}" height="${(p.w * k).toFixed(1)}"${cls === 'lose' ? ` fill="url(#${id})"` : ''}/>`;
  const T = (p, txt, cls) => { const w = p.l * k, h = p.w * k; if (!(w > txt.length * 7.3 + 10 && h > 18)) return ''; return `<text${cls ? ` class="${cls}"` : ''} x="${(pl + (p.l0 + p.l / 2) * k).toFixed(1)}" y="${(pt + (p.a0 + p.w / 2) * k + 4).toFixed(1)}" text-anchor="middle">${esc(txt)}</text>`; };
  let s = `<svg class="plan" viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" width="${vw.toFixed(0)}" role="img" aria-label="Plano de corte">${hatch(id)}`;
  s += R({ a0: 0, l0: 0, w: W, l: L }, 'ctx');
  keep.forEach(p => { s += R(p, 'keep') + T(p, 'Sobra ' + dimTxt(p.w, p.l)); });
  lose.forEach(p => { s += R(p, 'lose') + T(p, 'perda'); });
  const rp = { a0: 0, l0: 0, w: rug.x, l: rug.y };
  s += R(rp, 'rug') + (T(rp, rugLabel, 'on') || T(rp, 'Tapete', 'on'));
  const yb = pt + W * k + 14, xe = (pl + L * k).toFixed(1);
  s += `<line class="dl" x1="${pl}" y1="${yb - 6}" x2="${pl}" y2="${yb + 2}"/><line class="dl" x1="${xe}" y1="${yb - 6}" x2="${xe}" y2="${yb + 2}"/><line class="dl" x1="${pl}" y1="${yb - 2}" x2="${xe}" y2="${yb - 2}"/>`;
  s += `<text class="dim" x="${(pl + L * k / 2).toFixed(1)}" y="${yb + 11}" text-anchor="middle">${fm(L)}</text>`;
  s += `<text class="dim" transform="translate(${pl - 10} ${(pt + W * k / 2).toFixed(1)}) rotate(-90)" text-anchor="middle">${fm(W)}</text>`;
  return s + '</svg>';
}
const rollHistory = m => S.movimentos.filter(v => !v.desfeito && v.fonte?.tipo === 'manta' && v.fonte.id === m.id).sort((p, q) => String(p.data).localeCompare(String(q.data)));
function drawRoll(m) {
  const id = 'h' + (++svgN), W = m.largura, L = m.comprimento, k = Math.min(620 / L, 100 / W);
  const pl = 6, pt = 6, vw = pl * 2 + L * k, vh = pt + W * k + 30;
  const X = v => (pl + v * k).toFixed(1), Y = v => (pt + v * k).toFixed(1);
  let s = `<svg class="plan" viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" width="${vw.toFixed(0)}" role="img" aria-label="Rolo ${esc(m.codigo)}">${hatch(id)}`;
  s += `<rect class="ctx" x="${X(0)}" y="${Y(0)}" width="${(L * k).toFixed(1)}" height="${(W * k).toFixed(1)}"/>`;
  let pos = 0;
  for (const v of rollHistory(m)) {
    const c = Math.max(0, v.consumo || 0);
    if (c <= EPS) continue;
    if (v.tipo === 'corte') {
      const x = Math.min(W, v.atravessado || W);
      s += `<rect class="rug" x="${X(pos)}" y="${Y(0)}" width="${(c * k).toFixed(1)}" height="${(x * k).toFixed(1)}"/>`;
      if (W - x > EPS) { const kept = (v.sobrasGeradas || []).length > 0; s += `<rect class="${kept ? 'keep' : 'lose'}" x="${X(pos)}" y="${Y(x)}" width="${(c * k).toFixed(1)}" height="${((W - x) * k).toFixed(1)}"${kept ? '' : ` fill="url(#${id})"`}/>`; }
      s += `<line class="cut" x1="${X(pos + c)}" y1="${Y(0)}" x2="${X(pos + c)}" y2="${Y(W)}"/>`;
    } else s += `<rect class="used" x="${X(pos)}" y="${Y(0)}" width="${(c * k).toFixed(1)}" height="${(W * k).toFixed(1)}"/>`;
    pos += c;
  }
  const used = Math.min(L, m.usado || 0);
  if (used - pos > EPS) s += `<rect class="used" x="${X(pos)}" y="${Y(0)}" width="${((used - pos) * k).toFixed(1)}" height="${(W * k).toFixed(1)}"/>`;
  const rest = L - used;
  if (rest > EPS) { const txt = 'restam ' + fm(rest); if (rest * k > txt.length * 7.3) s += `<text class="dim" x="${X(used + rest / 2)}" y="${Y(W / 2 + 0.04)}" text-anchor="middle">${txt}</text>`; }
  const yb = pt + W * k;
  for (let i = 0; i <= Math.floor(L + EPS); i++) {
    s += `<line class="tick" x1="${X(i)}" y1="${yb + 2}" x2="${X(i)}" y2="${yb + (i % 2 ? 6 : 9)}"/>`;
    if (i % 2 === 0 || L <= 8) s += `<text class="dim" x="${X(i)}" y="${yb + 22}" text-anchor="${i === 0 ? 'start' : i >= L - EPS ? 'end' : 'middle'}">${i}</text>`;
  }
  return s + '</svg>';
}
function miniRect(s, boxW, boxH, scale) {
  const a = Math.max(s.largura, s.comprimento), b = Math.min(s.largura, s.comprimento);
  const k = Math.min(scale || Infinity, (boxW - 6) / a, (boxH - 6) / b);

/* ---------- modal ---------- */
function modal({ title, body, submit, danger, onSubmit, open }) {
  const d = $('#dlg');
  if (d.open) d.close();
  d.innerHTML = `<form id="dlgForm" novalidate><header><h3>${title}</h3><button type="button" class="x" data-close aria-label="Fechar">×</button></header><div class="dlg-body">${body}<div class="msg err form-err" id="dlgErr"></div></div><footer><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="dlgOk">${submit}</button></footer></form>`;
  const form = $('#dlgForm');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    $('#dlgErr').textContent = '';
    $('#dlgOk').disabled = true;
    const res = await onSubmit(new FormData(form), form);
    $('#dlgOk').disabled = false;
    if (typeof res === 'string') { $('#dlgErr').textContent = res; return; }
    if (res !== false) d.close();
  });
  d.showModal();
  open && open(form);
}
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) $('#dlg').close(); });
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
const confirmDlg = (title, body, label, fn, danger = true) => modal({ title, body, submit: label, danger, onSubmit: async () => (await write(fn)) ? undefined : false });

/* ---------- ações nos dados ---------- */
const autor = () => S.authUser?.email || null;
async function applyCut(c, info) {
  const o = c.o, now = new Date().toISOString(), movId = uid(), novas = [];
  let n = maxCode('S', S.sobras);
  const mantaId = c.tipo === 'manta' ? c.src.id : c.src.mantaId;
  for (const p of o.keep) novas.push({ id: uid(), codigo: code('S', ++n, 3), materialId: c.src.materialId, mantaId, largura: p.w, comprimento: p.l, status: 'disponivel', criado: now, origemMovId: movId });
  const mov = {
    codigo: code('C', maxCode('C', S.movimentos) + 1, 4), tipo: 'corte', data: now, materialId: c.src.materialId,
    largura: info.a, comprimento: info.b, cliente: info.cliente || '', pedido: info.pedido || '',
    fonte: { tipo: c.tipo, id: c.src.id, codigo: c.src.codigo }, consumo: c.tipo === 'manta' ? r3(o.y) : 0,
    atravessado: r3(o.x), sobrasGeradas: novas.map(s => s.id), perda: o.waste, por: autor(),
  };
  if (c.tipo === 'manta') {
    const m = S.mantas.find(x => x.id === c.src.id);
    if (!m || restante(m) < o.y - EPS) throw new Error('a manta mudou enquanto você registrava. Confira e tente de novo.');
    mov.abertaAntes = !!m.aberta;
    const usado = r3((m.usado || 0) + o.y);
    await store.update('mantas', m.id, { usado, aberta: true, esgotada: r3(m.comprimento - usado) <= EPS });
  } else {
    const s = S.sobras.find(x => x.id === c.src.id);
    if (!s || s.status !== 'disponivel') throw new Error('essa sobra já foi usada por outra pessoa.');
    await store.update('sobras', s.id, { status: 'usada', baixaMovId: movId, baixa: now });
  }
  for (const { id, ...d } of novas) await store.set('sobras', id, d);
  await store.set('movimentos', movId, mov);
  return { movId, mov, novas };
}
async function undoMov(v) {
  const geradas = (v.sobrasGeradas || []).map(id => S.sobras.find(s => s.id === id)).filter(Boolean);
  const presa = geradas.find(s => s.status !== 'disponivel');
  if (presa) throw new Error(`a sobra ${presa.codigo} que saiu daqui já foi ${ST[presa.status][0].toLowerCase()}. Cancele aquele pedido primeiro.`);
  if (v.fonte?.tipo === 'manta') {
    const m = S.mantas.find(x => x.id === v.fonte.id);
    if (m) {
      const usado = Math.min(m.comprimento, Math.max(0, r3((m.usado || 0) - (v.consumo || 0))));
      await store.update('mantas', m.id, { usado, esgotada: false, aberta: v.tipo === 'corte' ? (!!v.abertaAntes || usado > EPS) : (m.aberta || usado > EPS) });
    }
  } else if (v.fonte?.tipo === 'sobra') {
    const s = S.sobras.find(x => x.id === v.fonte.id);
    if (s) await store.update('sobras', s.id, { status: 'disponivel', baixa: null, baixaMovId: null, destino: null });
  }
  for (const s of geradas) await store.del('sobras', s.id);
  await store.update('movimentos', v.id, { desfeito: true, desfeitoEm: new Date().toISOString() });
}
async function addMov(fields) {
  const id = uid();
  await store.set('movimentos', id, { codigo: code('C', maxCode('C', S.movimentos) + 1, 4), data: new Date().toISOString(), por: autor(), sobrasGeradas: [], consumo: 0, perda: 0, cliente: '', pedido: '', ...fields });
  return id;
}
async function seedCatalogo() {
  if (S.seeding || !canWrite() || S.config.catalogoCriado || S.materiais.length) return;
  S.seeding = true;
  try {
    for (let i = 0; i < CATALOGO.length; i++) {
      const [id, nome, cor] = CATALOGO[i];
      await store.set('materiais', id, { nome, cor, foto: `img/${id}.jpg`, obs: '', ordem: i, criado: new Date().toISOString() });
    }
    await store.set('config', 'geral', { ...S.config, catalogoCriado: true });
  } catch (e) { toast('Não foi possível criar o catálogo: ' + (e?.message || e), 'bad'); }
  S.seeding = false;
}
function resizeImage(file, max = 640) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem inválida')); };
    img.src = url;
  });
}

const table = (cols, rows) => `<div class="tbl"><table><thead><tr>${cols.map(c => `<th${c.startsWith('>') ? ' class="n"' : c.startsWith('~') ? ' class="hide-sm"' : ''}>${c.replace(/^[>~]/, '')}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const tabsBar = (key, items, cur) => `<div class="tabs">${items.map(([k, l]) => `<button type="button" class="tab" data-tab="${key}" data-val="${k}" aria-pressed="${k === cur}">${l}</button>`).join('')}</div>`;
const notice = () => S.mode === 'local' ? '<div class="notice">Modo demonstração: os dados ficam só neste navegador. Para a equipe toda ver o mesmo estoque, configure o banco de dados (veja o LEIAME).</div>'
  : S.mode === 'firebase' && !S.authUser ? '<div class="notice">Você está vendo o estoque. Para editar, <button class="link" data-act="login">entre com sua conta</button>.</div>' : '';
const loginBtn = () => S.mode === 'firebase' && !S.authUser ? '<button class="btn btn-primary" data-act="login">Entrar para editar</button>' : '';
const bar = m => `<span class="bar" title="Usado ${fm(m.usado || 0)} de ${fm(m.comprimento)}"><i style="width:${Math.min(100, (m.usado || 0) / m.comprimento * 100).toFixed(1)}%"></i></span>`;
function resumo(mat) {
  const ms = S.mantas.filter(m => !mat || m.materialId === mat);
  const ab = ms.filter(m => stManta(m) === 'aberta'), fe = ms.filter(m => stManta(m) === 'fechada');
  const sb = S.sobras.filter(s => s.status === 'disponivel' && (!mat || s.materialId === mat));
  const metros = sum(ab, restante) + sum(fe, m => m.comprimento);
  const m2 = sum(ab, m => restante(m) * m.largura) + sum(fe, m => m.comprimento * m.largura) + sum(sb, area);
  return { ab, fe, sb, mAb: sum(ab, restante), metros, m2 };
}
const mantaRow = m => `<tr data-href="m-${m.id}"><td class="nowrap"><a class="t mono" href="#m-${m.id}">${esc(m.codigo)}</a></td><td>${pill(stManta(m))}</td><td style="width:40%">${bar(m)}</td><td class="n">${fm(restante(m))}</td><td class="hide-sm muted nowrap">${fDate(m.entrada)}</td></tr>`;

const sobraScale = list => Math.min(...list.map(s => Math.min(46 / Math.max(s.largura, s.comprimento), 28 / Math.min(s.largura, s.comprimento))), 999);
const pedidoRow = v => `<tr data-href="o-${v.id}"><td class="nowrap"><a class="t mono" href="#o-${v.id}">${esc(v.codigo)}</a></td><td class="muted nowrap">${fDateTime(v.data)}</td><td>${esc(v.cliente || '—')}</td><td class="hide-sm">${cname(v.materialId)}</td><td class="mono nowrap">${v.largura ? `${f2(v.largura)} × ${f2(v.comprimento)}` : '—'}</td><td>${movPill(v)}</td></tr>`;
function stockLine(id) {

      const W = S.mantas.find(x => x.id === v.fonte.id)?.largura || cfg().larguraPadrao, x = v.atravessado || W, y = v.consumo;

      if (y > EPS) plano = drawPlan({ W, L: y, rug: { x, y }, rugLabel, keep: ger.length ? piece : [], lose: ger.length ? [] : piece });
    } else {

function npUpdate() {
  const u = S.ui.np, src = $('#npSrc'), sm = $('#npSum'); if (!src) return;
  P.npCur = null;
  const a = num(u.a), b = num(u.b), c = cfg();
  const off = (msg, cls = '') => { src.innerHTML = `<div class="msg ${cls}">${msg}</div>`; sm.innerHTML = `<p class="muted small">Preencha a medida para ver o resumo.</p><button class="btn btn-primary btn-block" disabled>Criar pedido</button>`; };
  if (!(a > 0 && b > 0)) return off('<b>Digite a largura e o comprimento do tapete.</b><br>Ex.: 1,00 × 0,60. Use vírgula ou ponto.');
  if (a > 30 || b > 30) return off('Medida muito grande. Confira se digitou em metros (ex.: 0,60 e não 60).', 'err');
  const ms = S.mantas.filter(m => m.materialId === u.mat && stManta(m) !== 'esgotada');
  const maxW = Math.max(c.larguraPadrao, ...ms.map(m => m.largura));
  if (Math.min(a, b) > maxW + EPS) return off(`Não cabe em uma manta: o lado menor precisa ter até ${fm(maxW)}.`, 'err');
  const cands = recommend(u.mat, a, b);
  if (!cands.length) {
    const abs = ms.filter(m => stManta(m) === 'aberta');
    return off(`<b>Sem estoque de ${esc(matName(u.mat))} para essa medida.</b><br>${ms.length ? `As mantas abertas não têm metragem suficiente (maior restante: ${fm(Math.max(0, ...abs.map(restante)))}).` : 'Não há rolos desta cor.'} <a class="link" href="#p-${u.mat}">Adicionar mantas</a>`, 'err');
  }
  if (!cands.some(x => x.key === u.sel)) u.sel = cands[0].key;
  const cur = cands.find(x => x.key === u.sel), o = cur.o;
  src.innerHTML = `<div class="srcs" role="radiogroup" aria-label="De onde cortar">${cands.map((x, i) => {
    const s = x.src, exato = x.tipo === 'sobra' && !x.o.keep.length && x.o.waste < EPS;
    const t = x.tipo === 'sobra' ? `Sobra <span class="mono">${esc(s.codigo)}</span> · <span class="mono">${dimTxt(s.largura, s.comprimento)}</span>` : `${x.fechada ? 'Abrir manta' : 'Manta'} <span class="mono">${esc(s.codigo)}</span>`;
    const sub = x.tipo === 'sobra' ? `${exato ? 'Encaixe exato · ' : ''}guardada ${age(s.criado)}` : x.fechada ? `Lacrada${x.outras ? ` · mais ${x.outras} fechada(s)` : ''}` : `Restam ${fm(restante(s))}`;
    return `<button type="button" class="src" role="radio" aria-checked="${x.key === u.sel}" data-src="${x.key}"><span class="radio"></span><span class="t"><b>${t}</b>${i === 0 ? ' <span class="pill ok">Recomendado</span>' : ''}<small>${sub}</small></span><span class="r">${x.tipo === 'sobra' ? 'sem gastar manta' : 'usa ' + fm(x.o.y)}</span></button>`;
  }).join('')}</div>
    <div class="plan-wrap">${drawPlan({ W: o.regionW, L: o.regionL, rug: o, rugLabel: `Tapete ${f2(a)} × ${f2(b)}`, keep: o.keep, lose: o.lose })}</div>${legend(false)}`;
  const depois = cur.tipo === 'manta' ? r3(restante(cur.src) - o.y) : 0;
  sm.innerHTML = `<ul class="kv"><li><span>Tapete</span><b>${f2(a)} × ${f2(b)} m</b></li><li><span>Origem</span><b>${cur.tipo === 'sobra' ? 'Sobra' : 'Manta'} ${esc(cur.src.codigo)}</b></li>
    ${cur.tipo === 'manta' ? `<li><span>Corta da manta</span><b>${fm(o.y)}</b></li><li><span>Manta fica com</span><b>${fm(depois)}</b></li>` : ''}
    <li><span>Sobra guardada</span><b>${o.keep.length ? o.keep.map(p => dimTxt(p.w, p.l)).join('<br>') : '—'}</b></li>${o.waste > EPS ? `<li><span>Perda</span><b>${fm2(o.waste)}</b></li>` : ''}</ul>

  P.npCur = { cand: cur, a, b };
}

/* ---------- salvar formulários ---------- */
const SAVE = {
  async produto(fd, id) {
    const nome = String(fd.get('nome') || '').trim();
    if (!nome) return 'Dê um nome para a cor.';
    if (S.materiais.some(x => x.id !== id && x.nome.toLowerCase() === nome.toLowerCase())) return 'Já existe uma cor com esse nome.';
    const ord = num(fd.get('ordem'));
    const d = { nome, cor: String(fd.get('cor') || '#9A9DA3'), obs: String(fd.get('obs') || '').trim(), foto: String(fd.get('foto') || ''), ordem: Number.isFinite(ord) ? ord : 999 };
    if (id) return (await write(() => store.update('materiais', id, d))) ? { msg: 'Salvo.' } : false;
    const nid = uid();
    return (await write(() => store.set('materiais', nid, { ...d, criado: new Date().toISOString() }))) ? { msg: `“${nome}” adicionada. Agora adicione os rolos.`, go: 'p-' + nid } : false;
  },
  async manta(fd, id) {
    const m = S.mantas.find(x => x.id === id); if (!m) return 'A manta não existe mais.';
    const d = { lote: String(fd.get('lote') || '').trim() };
    if (fd.get('entrada')) d.entrada = new Date(fd.get('entrada') + 'T12:00:00').toISOString();
    const rest = fd.has('rest') ? num(fd.get('rest')) : restante(m);
    if (!(rest >= 0 && rest <= m.comprimento + EPS)) return `A metragem restante deve ficar entre 0 e ${f2(m.comprimento)} m.`;
    const delta = r3(restante(m) - rest);
    const ok = await write(async () => {
      if (Math.abs(delta) >= EPS) {
        Object.assign(d, { usado: r3(m.comprimento - rest), aberta: true, esgotada: rest <= EPS });
        await addMov({ tipo: 'ajuste', materialId: m.materialId, fonte: { tipo: 'manta', id: m.id, codigo: m.codigo }, consumo: delta, pedido: 'Metragem medida: ' + fm(rest) });
      }
      await store.update('mantas', m.id, d);
    });
    return ok ? { msg: Math.abs(delta) >= EPS ? `${m.codigo} salva. Ajuste de ${fm(Math.abs(delta))} registrado.` : `${m.codigo} salva.` } : false;
  },
  async pedido(fd, id) {
    const d = { pedido: String(fd.get('pedido') || '').trim() };
    if (fd.has('cliente')) d.cliente = String(fd.get('cliente') || '').trim();
    return (await write(() => store.update('movimentos', id, d))) ? { msg: 'Pedido salvo.' } : false;
  },
  async regras(fd) {
    const w = num(fd.get('w')), l = num(fd.get('l')), mn = num(fd.get('min'));
    if (!(w > 0 && w <= 5 && l > 0 && l <= 100 && mn >= 0.05 && mn <= 2)) return 'Confira os valores: largura até 5 m, comprimento até 100 m, menor sobra entre 0,05 e 2 m.';
    return (await write(() => store.set('config', 'geral', { ...S.config, larguraPadrao: r3(w), comprimentoPadrao: r3(l), sobraMin: r3(mn) }))) ? { msg: 'Regras salvas.' } : false;
  },
};
function setDirty(form) { S.dirty = form ? { name: form.dataset.form, id: form.dataset.id } : null; $('#savebar').hidden = !S.dirty; }
async function saveForm() {
  const form = $('[data-form]'); if (!form) return setDirty(null);
  const res = await SAVE[form.dataset.form](new FormData(form), form.dataset.id || '');
  if (typeof res === 'string') return toast(res, 'bad');
  if (!res) return;
  setDirty(null); toast(res.msg);
  if (res.go) go(res.go, true); else render(true);
}

/* ---------- navegação ---------- */
const PAGES = ['catalogo', 'novo-produto', 'pedidos', 'novo-pedido', 'sobras', 'regras'];
function parse(h) {
  h = h || 'catalogo';
  const m = h.match(/^([pmos])-(.+)$/);
  if (m) return { page: { p: 'produto', m: 'manta', o: 'pedido', s: 'sobra' }[m[1]], id: m[2] };
  return { page: PAGES.includes(h) ? h : 'catalogo' };
}
const NAV_OF = { produto: 'catalogo', manta: 'catalogo', 'novo-produto': 'catalogo', pedido: 'pedidos', 'novo-pedido': 'pedidos', sobra: 'sobras' };
function go(h, force) {
  if (S.dirty && !force) {
    modal({ title: 'Sair sem salvar?', body: '<p>As alterações desta página serão perdidas.</p>', submit: 'Descartar e sair', danger: true, onSubmit: () => { setDirty(null); go(h, true); } });
    return;
  }
  setDirty(null);
  try { if (location.hash.slice(1) !== h) history.pushState(null, '', '#' + h); } catch (e) { location.hash = h; }
  S.route = parse(h);
  render(true); window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { setDirty(null); S.route = parse(location.hash.slice(1)); render(true); });
window.addEventListener('hashchange', () => { const r = parse(location.hash.slice(1)); if (r.page !== S.route.page || r.id !== S.route.id) { setDirty(null); S.route = r; render(true); } });

let tmr = 0;
function scheduleRender() { if (tmr) return; tmr = setTimeout(() => { tmr = 0; if (ready()) seedCatalogo(); render(); }, 16); }
function render(force) {
  const r = S.route;
  document.querySelectorAll('.navs .nav').forEach(a => { if (a.dataset.nav === (NAV_OF[r.page] || r.page)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#navPedidos').hidden = !canSeePedidos();
  $('#who').innerHTML = S.mode === 'firebase' ? (S.authUser ? `<i class="dot on"></i><span class="em">${esc(S.authUser.email)}</span><button class="btn btn-sm" data-act="logout">Sair</button>` : '<button class="btn btn-sm btn-primary" data-act="login">Entrar</button>')
    : S.mode === 'local' ? '<i class="dot local"></i>Demonstração' : '<i class="dot"></i>Conectando…';
  const el = $('#app');
  if (!ready()) { el.innerHTML = '<div class="loading">Carregando…</div>'; return; }
  const ae = document.activeElement;
  if (!force && (S.dirty || (ae && el.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)))) { S.pending = true; return; }
  S.pending = false;
  el.innerHTML = P[r.page](r.id);
  if (r.page === 'novo-pedido') npUpdate();
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.pending && !S.dirty) render(); }, 0));

/* ---------- eventos ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest('#dlg')) return;
  const f = t.closest('[data-form]');
  if (f) { if (!S.dirty && canWrite()) setDirty(f); return; }
  const np = S.ui.np, map = { npA: 'a', npB: 'b', npCli: 'cliente', npPed: 'pedido' };
  if (map[t.id]) { np[map[t.id]] = t.value; if (t.id === 'npA' || t.id === 'npB') npUpdate(); return; }
  if (t.id === 'qCat') { S.ui.cat.q = t.value; $('#list').innerHTML = P.catalogoList(); }
  if (t.id === 'qO') { S.ui.pedidos.q = t.value; $('#list').innerHTML = P.pedidosList(); }
  if (t.id === 'sA' || t.id === 'sB') { S.ui.sobras[t.id === 'sA' ? 'a' : 'b'] = t.value; $('#list').innerHTML = P.sobrasList(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'npMat') { S.ui.np.mat = e.target.value; S.ui.np.sel = null; $('#npThumb .thumb').outerHTML = thumb(S.ui.np.mat); npUpdate(); }
});
$('#fotoFile').addEventListener('change', async e => {
  const file = e.target.files?.[0]; e.target.value = '';
  const form = $('[data-form="produto"]'); if (!file || !form) return;
  try {
    const url = await resizeImage(file);
    form.foto.value = url; $('#fotoPrev').innerHTML = `<img src="${url}" alt="">`;
    setDirty(form); toast('Foto pronta. Clique em Salvar.');
  } catch (err) { toast('Não foi possível ler essa imagem.', 'bad'); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f) { e.preventDefault(); if (!canWrite()) return; if (!S.dirty) setDirty(f); saveForm(); } });
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.closest('#dlg')) return;
  const a = t.closest('a[href^="#"]');
  const tr = !a && t.closest('tr[data-href]');
  if (a || tr) {
    e.preventDefault();
    const np = S.ui.np, d = (a || tr).dataset;
    if (d.npMat) { np.mat = d.npMat; np.sel = null; }
    if (d.npA !== undefined) { np.a = d.npA; np.b = d.npB; }
    if (d.npSobra) { const s = S.sobras.find(x => x.id === d.npSobra); if (s) { np.mat = s.materialId; np.sel = 'sobra:' + s.id; } }
    go(a ? a.getAttribute('href').slice(1) : tr.dataset.href);
    return;
  }
  const tab = t.closest('[data-tab]');
  if (tab) {
    if (S.dirty) return toast('Salve ou descarte as alterações primeiro.');
    S.ui[tab.dataset.tab][tab.dataset.key || 'tab'] = tab.dataset.val;
    if (tab.dataset.tab === 'cat') { document.querySelectorAll('[data-tab="cat"]').forEach(b => b.setAttribute('aria-pressed', b === tab)); $('#list').innerHTML = P.catalogoList(); }
    else render(true);
    return;
  }
  const src = t.closest('[data-src]');
  if (src) { S.ui.np.sel = src.dataset.src; npUpdate(); return; }
  const pre = t.closest('[data-preset]');
  if (pre) { const [x, y] = pre.dataset.preset.split(',').map(Number); S.ui.np.a = f2(x); S.ui.np.b = f2(y); $('#npA').value = S.ui.np.a; $('#npB').value = S.ui.np.b; npUpdate(); return; }
  const b = t.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === 'salvar-edicao') saveForm();
  else if (act === 'descartar-edicao') { setDirty(null); render(true); }
  else if (act === 'login') dlgLogin();
  else if (act === 'logout') { if (S.dirty) setDirty(null); await store.au.signOut(store.auth); toast('Você saiu.'); }
  else if (act === 'trocar-foto') $('#fotoFile').click();
  else if (act === 'remover-foto') { const f = $('[data-form="produto"]'); f.foto.value = ''; $('#fotoPrev').innerHTML = rollIcon(f.cor.value); setDirty(f); }
  else if (act === 'entrada') dlgEntrada(id);
  else if (act === 'encerrar') { const m = S.mantas.find(x => x.id === id); m && dlgEncerrar(m); }
  else if (act === 'excluir-manta') { const m = S.mantas.find(x => x.id === id); confirmDlg(`Excluir ${esc(m?.codigo)}`, '<p>A manta ainda não tem cortes. Use para corrigir uma entrada feita por engano.</p>', 'Excluir manta', async () => { const mat = m.materialId; await store.del('mantas', id); go('p-' + mat, true); }); }
  else if (act === 'excluir-produto') { const m = matById(id); confirmDlg('Excluir cor', `<p>Excluir “${esc(m?.nome)}” do catálogo? Ela não tem rolos nem sobras.</p>`, 'Excluir', async () => { await store.del('materiais', id); go('catalogo', true); }); }
  else if (act === 'vender') { const s = S.sobras.find(x => x.id === id); s && dlgVender(s); }
  else if (act === 'descartar') { const s = S.sobras.find(x => x.id === id); s && dlgDescartar(s); }
  else if (act === 'criar-pedido') {
    const cur = P.npCur; if (!cur) return;
    const u = S.ui.np; let res;
    const ok = await write(async () => { res = await applyCut(cur.cand, { a: r3(cur.a), b: r3(cur.b), cliente: u.cliente.trim(), pedido: u.pedido.trim() }); });
    if (!ok) return;
    toast(`Pedido ${res.mov.codigo} criado${res.novas.length ? '. Sobra guardada: ' + res.novas.map(s => `${s.codigo} (${dimTxt(s.largura, s.comprimento)})`).join(', ') : ''}.`);
    Object.assign(u, { a: '', b: '', cliente: '', pedido: '', sel: null });
    go('o-' + res.movId, true);
  }
  else if (act === 'desfazer') {
    const v = S.movimentos.find(x => x.id === id); if (!v) return;
    const ped = isPedido(v);
    modal({
      title: ped ? `Cancelar pedido ${esc(v.codigo)}` : `Desfazer ${esc(v.codigo)}`, submit: ped ? 'Cancelar pedido' : 'Desfazer', danger: true,
      body: `<p>${v.fonte?.tipo === 'manta' && v.consumo ? `Devolve ${fm(v.consumo)} para a manta ${esc(v.fonte.codigo)}` : `A sobra ${esc(v.fonte?.codigo)} volta a ficar disponível`}${(v.sobrasGeradas || []).length ? ' e apaga a sobra gerada' : ''}.</p><p class="muted small">O registro continua na lista como cancelado.</p>`,
      onSubmit: async () => { let msg = ''; const ok = await write(async () => { try { await undoMov(v); } catch (err) { msg = 'Não dá para desfazer: ' + err.message; } }); if (msg) return msg; if (!ok) return false; toast(`${v.codigo} ${ped ? 'cancelado' : 'desfeito'}.`); },
    });
  }
});

/* ---------- início ---------- */
function subMov() {
  if (unsubMov) { unsubMov(); unsubMov = null; }
  if (!canSeePedidos()) { S.movimentos = []; S.loaded.add('movimentos'); scheduleRender(); return; }
  S.loaded.delete('movimentos');
  unsubMov = store.sub('movimentos', list => { S.movimentos = list; S.loaded.add('movimentos'); scheduleRender(); }, () => { S.movimentos = []; S.loaded.add('movimentos'); scheduleRender(); });
}
async function boot() {
  S.route = parse(location.hash.slice(1)); render(true);
  const conf = window.FJR_FIREBASE;
  if (conf && conf.apiKey) {
    try { store = await firebaseStore(conf); S.mode = 'firebase'; }
    catch (e) { console.error(e); store = localStore(); S.mode = 'local'; toast('Não foi possível conectar ao banco de dados. Usando modo demonstração.', 'bad'); }
  } else { store = localStore(); S.mode = 'local'; }
  for (const col of COLS) {
    store.sub(col, list => {
      if (col === 'config') { const g = list.find(d => d.id === 'geral'); const { id, ...rest } = g || {}; S.config = rest; }
      else S[col] = list;
      S.loaded.add(col);
      scheduleRender();
    }, err => { console.error(err); S.loaded.add(col); scheduleRender(); });
  }
  if (S.mode === 'firebase') {
    store.au.onAuthStateChanged(store.auth, u => {
      S.authUser = u ? { uid: u.uid, email: u.email } : null;
      subMov(); if (!S.dirty) render(true);
    });
  } else subMov();
}
boot();
})();
</script>
</body>
