<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estoque FJR Solutions</title>
<meta name="description" content="Estoque de mantas e baldes de tinta da FJR Solutions.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: vitrine escura da FJR — logo central, abas Mantas / Baldes de tinta, grade de cores; na cor, um ícone por rolo ou balde */
:root{
  color-scheme:dark;
  --bg:#050608; --surface:#101318; --surface-2:#161a21; --hover:#1b2029; --ink:#F1F3F7; --muted:#99A1B1; --line:#252b36;
  --accent:#F2552C; --accent-ink:#FF7C57; --accent-soft:rgba(242,85,44,.15); --on-accent:#FFFFFF;
  --ok:#5CCB93; --ok-bg:rgba(92,203,147,.13); --warn:#E9B04F; --warn-bg:rgba(233,176,79,.13); --bad:#F27A7A; --bad-bg:rgba(242,122,122,.13);
  --glow-blue:rgba(32,70,220,.30); --glow-red:rgba(225,45,30,.26);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(55% 45% at 0% 0%,var(--glow-blue),transparent 70%),radial-gradient(45% 45% at 100% 0%,var(--glow-red),transparent 70%),radial-gradient(45% 45% at 0% 100%,var(--glow-red),transparent 70%),radial-gradient(55% 45% at 100% 100%,var(--glow-blue),transparent 70%),var(--bg);background-attachment:fixed}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;letter-spacing:.03em;text-transform:uppercase}
p{margin:0}
a{color:inherit}
img{max-width:100%}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(5,6,8,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:22px;height:60px}
.top .logo{height:30px;display:block}
.navs{display:flex;gap:4px;flex:1;min-width:0}
.nav{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
.nav:hover{color:var(--ink);background:var(--hover)}
.nav[aria-current="page"]{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--accent)}
.mode{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:.82rem;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.on{background:var(--ok)}.dot.local{background:var(--warn)}
main{padding-block:24px 90px}
.page{display:flex;flex-direction:column;gap:18px}
.notice{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(233,176,79,.25);border-radius:10px;padding:9px 12px;font-size:.86rem}

/* lista de cores */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:14px 4px}
.hero img{height:80px;width:auto}
.hero h1{font-size:1.6rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1;min-width:200px;max-width:340px}
.toolbar .btn{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 16px}
.pcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;border-radius:14px;padding:8px 8px 12px;border:1px solid transparent;transition:border-color .15s,background .15s,transform .15s}
.pcard:hover{background:var(--surface);border-color:var(--line);transform:translateY(-2px)}
.pcard .pic{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.pcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pic svg{width:70%;height:auto}
.pname{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:.03em;text-transform:uppercase;text-align:center;color:var(--c);line-height:1.1}
.pstock{display:flex;justify-content:center;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);text-align:center;flex-wrap:wrap}

/* página da cor */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph h1{color:var(--c)}
.ph .acts{margin-left:auto;display:flex;gap:8px}
.back{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;text-decoration:none;border:1px solid var(--line);background:var(--surface)}
.back:hover{border-color:var(--muted)}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.unit{appearance:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;transition:border-color .15s,transform .15s}
.unit:hover{border-color:var(--c);transform:translateY(-2px)}
.unit svg{width:110px;height:84px}
.unit .code{font-family:var(--f-mono);font-weight:500}
.unit .sub{font-size:.8rem;color:var(--muted)}
.unit .sub b{color:var(--ink);font-weight:600}
.pcs-tag{font-size:.75rem;font-weight:500;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 8px}
.pcs{display:flex;flex-direction:column;gap:8px}
.pcs h4{margin:0;font-size:.9rem}
.pcs summary{cursor:pointer;color:var(--muted)}
.dims{display:flex;align-items:center;gap:6px}
.dims .input{width:84px}
.dims b{color:var(--muted);font-weight:400}
#fCorte{flex-wrap:wrap}
svg.dw{width:100%;height:auto;display:block}
svg.dw text{font:600 12px var(--f-mono);fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:3px;text-anchor:middle;dominant-baseline:middle}
svg.dw text.soft{fill:rgba(255,255,255,.85);font-weight:500}
svg.dw text.axis{fill:var(--muted);stroke:none;font-weight:500;font-size:11px}
.order{display:flex;align-items:end;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pc{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.unit.done{opacity:.5}
.unit.add{border-style:dashed;background:transparent;color:var(--muted);justify-content:center;min-height:190px}
.unit.add:hover{color:var(--ink);border-color:var(--accent)}
.unit.add b{font-size:2rem;line-height:1;font-weight:400}

/* botões e campos */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.9rem;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{border-color:var(--accent-ink);background:var(--accent-ink)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#160606}
.btn-ghost-danger{color:var(--bad)}
.link{color:var(--accent-ink);font-weight:500;font-size:.88rem;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.84rem;font-weight:500}
.field small{color:var(--muted);font-size:.8rem}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=color].input{padding:3px;height:38px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inline{display:flex;gap:8px;align-items:end}
.inline .field{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.ok{background:var(--ok-bg);color:var(--ok);box-shadow:none}
.pill.hot{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.pill.closed{background:var(--surface-2);color:var(--ink)}
.bar{display:block;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:5px}
.big{display:flex;gap:16px;align-items:center}
.big svg{width:120px;height:92px;flex:none}
.big .info{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.big .rest{font-family:var(--f-mono);font-size:1rem}
.photo{border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;max-height:180px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo svg{width:50%}
.sep{border-top:1px solid var(--line);margin:2px 0}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:14px}
.empty b{color:var(--ink);font-size:1rem}

/* modal e aviso */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(500px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog .box{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
dialog header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog header h3{font-size:1.05rem}
dialog .x{appearance:none;border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.dlg-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:.88rem}
.err:empty{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#F1F3F7;color:#0b0d12;padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--bad);color:#160606}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

@media (max-width:560px){
  .top .wrap{gap:12px}
  .top .logo{height:24px}
  .nav{padding:8px 10px}
  .mode span{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
  .units{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .unit svg{width:96px;height:74px}
  .pname{font-size:1rem}
  .hero img{height:56px}
  h1{font-size:1.6rem}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .toolbar .btn{margin-left:0}
}
@media (prefers-reduced-motion:reduce){#toast,.pcard,.unit{transition:none}.pcard:hover,.unit:hover{transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="#mantas" aria-label="Início"><img class="logo" src="img/logo.png" alt="FJR Solutions"></a>
  <nav class="navs" aria-label="Menu">
    <a class="nav" href="#mantas" data-nav="manta">Mantas</a>
    <a class="nav" href="#tintas" data-nav="tinta">Baldes de tinta</a>
  </nav>
  <div class="mode" id="mode"><i class="dot"></i><span>Conectando…</span></div>
</div></header>
<main class="wrap" id="app"><div class="loading">Carregando…</div></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fotoFile" accept="image/*" hidden>

<script src="config.js"></script>
<script>
(() => {
const EPS = 0.001;
const COLS = ['produtos', 'unidades', 'config'];
const KIND = {
  manta: { tab: 'mantas', titulo: 'Mantas', um: 'manta', Um: 'Manta', umas: 'mantas', f: true, prefix: 'M', un: 'm', capLabel: 'Comprimento do rolo (m)', capDef: 12, addCor: 'Adicionar cor' },
  tinta: { tab: 'tintas', titulo: 'Baldes de tinta', um: 'balde', Um: 'Balde', umas: 'baldes', f: false, prefix: 'B', un: 'L', capLabel: 'Tamanho do balde (L)', capDef: 18, addCor: 'Adicionar tinta' },
};
const CATALOGO = [
  ['grafite', 'Manta Grafite', '#9A9DA3'], ['vermelha', 'Manta Vermelha', '#F0362B'], ['azul-royal', 'Manta Azul Royal', '#3B6CFF'],
  ['verde', 'Manta Verde', '#1FA866'], ['laranja', 'Manta Laranja', '#FF8A22'], ['bordo', 'Manta Bordô', '#E0406E'],
  ['pink', 'Manta Pink', '#FF45B0'], ['rosa-bebe', 'Manta Rosa Bebê', '#F7A3CF'], ['roxo', 'Manta Roxo', '#A24BFF'],
  ['azul-marinho', 'Manta Azul Marinho', '#4E6FD8'], ['azul-maritimo', 'Manta Azul Marítimo', '#22A6F5'], ['verde-floresta', 'Manta Verde Floresta', '#22A06F'],
  ['verde-musgo', 'Manta Verde Musgo', '#8EE02E'], ['verde-piscina', 'Manta Verde Piscina', '#2CD3E0'], ['preto', 'Manta Preto', '#E6E8EC'],
  ['cinza', 'Manta Cinza', '#A9ACB1'], ['marrom', 'Manta Marrom', '#C47A45'], ['bege', 'Manta Bege', '#E3CDA4'],
];
const S = { produtos: [], unidades: [], config: {}, loaded: new Set(), mode: 'loading', route: { page: 'lista', tipo: 'manta' }, busy: false, seeding: false, ui: { q: { manta: '', tinta: '' }, acabadas: false } };
let store = null;

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r3 = n => Math.round(n * 1000) / 1000;
const num = v => { const s = String(v ?? '').trim().replace(/\s/g, '').replace(',', '.'); return s === '' ? NaN : Number(s); };
const f2 = n => (Math.round(n * 100) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = (n, k) => `${f2(n)} ${KIND[k].un}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fDate = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '—';
const prodById = id => S.produtos.find(p => p.id === id);
const restante = u => r3(u.capacidade - ((u.tipo || 'manta') === 'manta' ? fimCortes(cortesOf(u)) : (u.usado || 0)));
const estado = u => u.esgotada ? 'acabou' : (u.aberta || (u.usado || 0) > EPS) ? 'aberta' : 'fechada';
const word = (k, st) => ({ fechada: KIND[k].f ? 'Lacrada' : 'Lacrado', aberta: KIND[k].f ? 'Aberta' : 'Aberto', acabou: 'Acabou' })[st];
const pill = (k, st) => `<span class="pill ${st === 'aberta' ? 'hot' : st === 'fechada' ? 'closed' : ''}">${word(k, st)}</span>`;
const ordem = p => p.ordem ?? 999;
const prodsOf = tipo => S.produtos.filter(p => (p.tipo || 'manta') === tipo).sort((a, b) => ordem(a) - ordem(b) || a.nome.localeCompare(b.nome, 'pt-BR'));
const unitsOf = id => S.unidades.filter(u => u.produtoId === id);
const ready = () => COLS.every(c => S.loaded.has(c));
const maxCode = (prefix, list) => list.reduce((mx, d) => { const m = String(d.codigo || '').match(new RegExp('^' + prefix + '-(\\d+)$')); return m ? Math.max(mx, +m[1]) : mx; }, 0);
const code = (prefix, n) => prefix + '-' + String(n).padStart(3, '0');
const backIcon = '<svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg>';
function hexRgb(h) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return [150, 150, 150]; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
const rgb = a => `rgb(${a.map(v => Math.round(Math.max(0, Math.min(255, v)))).join(',')})`;
const shade = (h, f) => rgb(hexRgb(h).map(v => v * f));
function labelColor(h) { const [r, g, b] = hexRgb(h); const L = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; return L < 0.35 ? rgb([r, g, b].map(v => v + (255 - v) * (0.35 - L) * 1.6)) : rgb([r, g, b]); }

/* Rolo: fechado = cheio e lacrado; aberto = mais fino conforme o que resta, com a ponta solta. */
function rollIcon(cor, ratio = 1, st = 'fechada') {
  const c = cor || '#8892a6', k = st === 'acabou' ? 0.18 : 0.35 + 0.65 * Math.sqrt(Math.max(0, Math.min(1, ratio)));
  const ry = 32 * k, cy = 84 - ry;
  const tail = st === 'fechada' ? '' : `<path d="M40 84 H150 L156 102 H30 Z" style="fill:${shade(c, .72)}"/>`;
  const band = st === 'fechada' ? `<rect x="84" y="${(cy - ry).toFixed(1)}" width="8" height="${(2 * ry).toFixed(1)}" fill="rgba(255,255,255,.55)"/>${seal(88, cy)}` : '';
  return `<svg viewBox="0 0 160 110" aria-hidden="true">${tail}<rect x="40" y="${(cy - ry).toFixed(1)}" width="96" height="${(2 * ry).toFixed(1)}" rx="${ry.toFixed(1)}" style="fill:${shade(c, 1)}"/>${band}<ellipse cx="40" cy="${cy.toFixed(1)}" rx="${(ry * 0.62).toFixed(1)}" ry="${ry.toFixed(1)}" style="fill:${shade(c, .62)}"/><ellipse cx="40" cy="${cy.toFixed(1)}" rx="${(ry * 0.4).toFixed(1)}" ry="${(ry * 0.65).toFixed(1)}" style="fill:${shade(c, .8)}"/><circle cx="40" cy="${cy.toFixed(1)}" r="5" fill="#d9c3a0"/></svg>`;
}
/* Lacre: selo laranja com visto, só em rolo ou balde 100% cheio. */
const seal = (x, y) => `<circle cx="${x}" cy="${y.toFixed(1)}" r="12" fill="#F2552C" stroke="#fff" stroke-width="2.5"/><path d="M${x - 5.5} ${(y + 0.5).toFixed(1)} l4 4 l7.5 -8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
/* Balde: fechado = com tampa; aberto = sem tampa, tinta no nível que resta. */
function bucketIcon(cor, ratio = 1, st = 'fechada') {
  const c = cor || '#8892a6', lv = st === 'acabou' ? 0 : Math.max(0, Math.min(1, ratio));
  const top = 22, bot = 102, y = bot - (bot - top - 6) * lv;
  const lid = st === 'fechada' ? `<rect x="44" y="12" width="72" height="12" rx="4" style="fill:${shade(c, .75)}"/><rect x="72" y="6" width="16" height="8" rx="3" style="fill:${shade(c, .6)}"/>` : `<ellipse cx="80" cy="${top}" rx="34" ry="6" fill="#0b0d12" stroke="#3a4150" stroke-width="2"/>`;
  return `<svg viewBox="0 0 160 110" aria-hidden="true"><defs><clipPath id="bk${++svgN}"><path d="M46 ${top} H114 L106 ${bot} Q80 ${bot + 6} 54 ${bot} Z"/></clipPath></defs>
    <path d="M46 ${top} H114 L106 ${bot} Q80 ${bot + 6} 54 ${bot} Z" fill="#cfd3da"/>
    <rect x="40" y="${y.toFixed(1)}" width="80" height="${(bot + 8 - y).toFixed(1)}" clip-path="url(#bk${svgN})" style="fill:${c}"/>
    <path d="M46 ${top} H114 L106 ${bot} Q80 ${bot + 6} 54 ${bot} Z" fill="none" stroke="#8d939e" stroke-width="2"/>

let svgN = 0;
const unitIcon = (tipo, cor, ratio, st) => tipo === 'tinta' ? bucketIcon(cor, ratio, st) : rollIcon(cor, ratio, st);
const foto = p => p?.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy">` : unitIcon(p?.tipo, p?.cor, 1, 'fechada');

/* ---------- cortes da manta ----------
   Cada corte é um retângulo no rolo: x/w atravessam a largura (1,20 m), y/h correm pelo comprimento.
   Medidas aparecem como comprimento × largura, do jeito que a fábrica fala ("2 metros por 60"). */
const LARG = 1.2, SOBRA_UTIL = 0.4, MIN_PECA = 0.05;
const largura = u => u.largura || LARG;
function cortesOf(u) {
  if (Array.isArray(u.cortes)) return u.cortes;
  return (u.usado || 0) > EPS ? [{ x: 0, y: 0, w: largura(u), h: u.usado }] : []; // lançamento antigo: metros corridos na largura toda
}
function fimCortes(cs) { return r3(cs.reduce((m, c) => Math.max(m, c.y + c.h), 0)); }
const medida = r => `${f2(r.h)} × ${f2(r.w)} m`;
const hit = (a, b) => a.x < b.x + b.w - EPS && b.x < a.x + a.w - EPS && a.y < b.y + b.h - EPS && b.y < a.y + a.h - EPS;
const inside = (a, b) => a.x >= b.x - EPS && a.y >= b.y - EPS && a.x + a.w <= b.x + b.w + EPS && a.y + a.h <= b.y + b.h + EPS;
const big = r => r.w > EPS && r.h > EPS;
/* Partes de f fora de c, cada uma ocupando o máximo possível (podem se sobrepor). */
function minusMax(f, c) {
  if (!hit(f, c)) return [f];
  return [{ x: f.x, y: f.y, w: c.x - f.x, h: f.h }, { x: c.x + c.w, y: f.y, w: f.x + f.w - c.x - c.w, h: f.h },
    { x: f.x, y: f.y, w: f.w, h: c.y - f.y }, { x: f.x, y: c.y + c.h, w: f.w, h: f.y + f.h - c.y - c.h }].filter(big);
}
/* Partes de f fora de c, sem sobreposição. */
function minusCut(f, c) {
  if (!hit(f, c)) return [f];
  const x0 = Math.max(f.x, c.x), x1 = Math.min(f.x + f.w, c.x + c.w);
  return [{ x: f.x, y: f.y, w: x0 - f.x, h: f.h }, { x: x1, y: f.y, w: f.x + f.w - x1, h: f.h },
    { x: x0, y: f.y, w: x1 - x0, h: c.y - f.y }, { x: x0, y: c.y + c.h, w: x1 - x0, h: f.y + f.h - c.y - c.h }].filter(big);
}
const prune = rs => rs.filter((r, i) => !rs.some((o, j) => j !== i && inside(r, o) && (!inside(o, r) || j < i)));
/* Maiores espaços livres do rolo: é com eles que se vê se um tapete ainda cabe. */
function livresDe(W, L, cs) {
  let free = [{ x: 0, y: 0, w: W, h: L }];
  for (const c of cs) free = prune(free.flatMap(f => minusMax(f, c)));
  return free;
}
/* Pedaços sobrando na parte já cortada do rolo (depois dela o rolo segue inteiro). */
function sobrasDe(W, L, cs) {
  const fim = fimCortes(cs);
  let rs = livresDe(W, L, cs).map(f => ({ ...f, h: Math.min(f.y + f.h, fim) - f.y })).filter(big);
  const out = [];
  while (rs.length) {
    rs.sort((a, b) => b.w * b.h - a.w * a.h);
    const p = rs.shift(); out.push(p);
    rs = rs.flatMap(r => minusCut(r, p));
  }
  return out.filter(r => r.w >= MIN_PECA - EPS && r.h >= MIN_PECA - EPS).map(r => ({ x: r3(r.x), y: r3(r.y), w: r3(r.w), h: r3(r.h) }));
}
const sobras = u => sobrasDe(largura(u), u.capacidade, cortesOf(u));
/* Onde cortar um tapete a × b (pode girar). Prioridade: caber numa sobra sem avançar no rolo;
   não deixar uma tira fina demais para outro tapete; avançar o mínimo no rolo. */
function encaixes(u, a, b) {
  const cs = cortesOf(u), fim = fimCortes(cs), list = [];
  for (const f of livresDe(largura(u), u.capacidade, cs)) for (const [w, h] of a === b ? [[a, b]] : [[a, b], [b, a]]) {
    if (w > f.w + EPS || h > f.h + EPS) continue;
    const gasto = r3(Math.max(fim, f.y + h) - fim), resto = f.w - w;
    list.push({ x: r3(f.x), y: r3(f.y), w, h, gasto, key: [gasto > EPS ? 1 : 0, resto > EPS && resto < SOBRA_UTIL ? 1 : 0, gasto, f.y, f.x] });
  }
  return list.sort((p, q) => cmpKey(p.key, q.key));
}
function cmpKey(a, b) { for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; if (Math.abs(d) > EPS) return d; } return 0; }
/* Desenho da manta deitada, como no papel: comprimento para a direita, largura para baixo. */
function desenho(u, cor, novo) {
  const W = largura(u), L = u.capacidade, cs = novo ? [...cortesOf(u), novo] : cortesOf(u), fim = fimCortes(cs);
  const pad = 24, AW = 392;
  const s = Math.min(AW / Math.max(fim * 1.3, 0.6), 150 / W), D = Math.min(L, AW / s), PW = D * s, PH = W * s;
  const X = v => (pad + v * s).toFixed(1), Y = v => (pad + v * s).toFixed(1);
  const box = (r, attrs) => `<rect x="${X(r.y)}" y="${Y(r.x)}" width="${(Math.min(r.h, D - r.y) * s).toFixed(1)}" height="${(r.w * s).toFixed(1)}" ${attrs}/>`;
  const lbl = (r, t, cls = '') => Math.min(r.h, D - r.y) * s >= t.length * 7.2 + 6 && r.w * s >= 18 ? `<text x="${X(r.y + Math.min(r.h, D - r.y) / 2)}" y="${Y(r.x + r.w / 2)}" class="${cls}">${t}</text>` : '';
  const id = 'h' + (++svgN), sb = sobrasDe(W, L, cs);
  const resto = { x: 0, y: fim, w: W, h: L - fim };
  return `<svg class="dw" viewBox="0 0 ${AW + 2 * pad} ${(PH + 2 * pad).toFixed(0)}" role="img" aria-label="Desenho dos cortes da manta">
    <defs><pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#0b0d12"/><line x1="0" y1="0" x2="0" y2="8" stroke="#3a4150" stroke-width="3"/></pattern></defs>
    <rect x="${pad}" y="${pad}" width="${PW.toFixed(1)}" height="${PH.toFixed(1)}" rx="2" style="fill:${shade(cor, .85)}"/>
    ${cortesOf(u).map(c => box(c, `fill="url(#${id})" stroke="#000" stroke-width="1"`)).join('')}
    ${sb.map(r => box(r, 'fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="5 4"') + lbl(r, medida(r).slice(0, -2))).join('')}
    ${novo ? box(novo, 'fill="rgba(242,85,44,.88)" stroke="#fff" stroke-width="2"') + lbl(novo, medida(novo).slice(0, -2)) : ''}
    ${resto.h > EPS ? lbl(resto, `rolo inteiro ${f2(resto.h)} m`, 'soft') : ''}
    ${D < L - EPS ? `<path d="M${X(D) - 0} ${pad} l-6 ${(PH / 4).toFixed(1)} l6 ${(PH / 4).toFixed(1)} l-6 ${(PH / 4).toFixed(1)} l6 ${(PH / 4).toFixed(1)}" fill="none" stroke="#050608" stroke-width="3"/>` : ''}
    ${fim > EPS ? `<line x1="${X(fim)}" y1="${pad - 6}" x2="${X(fim)}" y2="${(pad + PH + 6).toFixed(1)}" stroke="#F1F3F7" stroke-width="1" stroke-dasharray="2 3"/><text x="${X(fim)}" y="${pad - 11}" class="axis">${f2(fim)} m</text>` : ''}
    <text x="${pad - 9}" y="${(pad + PH / 2).toFixed(1)}" class="axis" transform="rotate(-90 ${pad - 9} ${(pad + PH / 2).toFixed(1)})">${f2(W)} m</text>
  </svg>`;
}

function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = kind || ''; }, 3500);

/* ---------- armazenamento ---------- */
async function firebaseStore(conf) {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [app, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
  const db = fs.initializeFirestore(app.initializeApp(conf), { ignoreUndefinedProperties: true });
  return {
    sub: (col, cb, err) => fs.onSnapshot(fs.collection(db, col), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err),
    set: (col, id, d) => fs.setDoc(fs.doc(db, col, id), d),
    update: (col, id, d) => fs.updateDoc(fs.doc(db, col, id), d),
    del: (col, id) => fs.deleteDoc(fs.doc(db, col, id)),
  };
}
function localStore() {
  const KEY = 'fjr-estoque-v2';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
  const subs = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('O navegador não deixou salvar (espaço cheio?).', 'bad'); } };
  const emit = col => { const list = Object.entries(data[col] || {}).map(([id, d]) => ({ id, ...d })); (subs[col] || []).forEach(cb => cb(list)); };
  const clone = d => JSON.parse(JSON.stringify(d));
  return {
    sub(col, cb) { (subs[col] ||= []).push(cb); queueMicrotask(() => emit(col)); },
    async set(col, id, d) { (data[col] ||= {})[id] = clone(d); save(); emit(col); },
    async update(col, id, d) { if (!data[col]?.[id]) throw new Error('registro não encontrado'); data[col][id] = { ...data[col][id], ...clone(d) }; save(); emit(col); },
    async del(col, id) { if (data[col]) delete data[col][id]; save(); emit(col); },
  };
}
async function write(fn) {
  if (S.busy) return false;
  S.busy = true;
  try { await fn(); return true; }
  catch (e) { toast('Não foi possível salvar: ' + (e?.code === 'permission-denied' ? 'o banco de dados recusou (confira as regras do Firestore).' : e?.message || e), 'bad'); return false; }
  finally { S.busy = false; }
}
async function seedCatalogo() {
  if (S.seeding || S.config.catalogoCriado || prodsOf('manta').length) return;
  S.seeding = true;
  try {
    for (let i = 0; i < CATALOGO.length; i++) {
      const [id, nome, cor] = CATALOGO[i];
      await store.set('produtos', id, { tipo: 'manta', nome, cor, foto: `img/${id}.jpg`, ordem: i + 1, capPadrao: 12, criado: new Date().toISOString() });
    }
    await store.set('config', 'geral', { ...S.config, catalogoCriado: true });
  } catch (e) { toast('Não foi possível montar o catálogo: ' + (e?.message || e), 'bad'); }
  S.seeding = false;
}
function resizeImage(file, max = 640) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem inválida')); };
    img.src = url;
  });
}

const dlgErr = m => { const e = $('#dlgErr'); if (e) e.textContent = m || ''; };

/* Uma manta ou um balde: estado, quanto resta e as ações. */
function dlgUnidade(id) {
  const u = S.unidades.find(x => x.id === id); if (!u) return;
  const p = prodById(u.produtoId), k = p?.tipo || 'manta', K = KIND[k], st = estado(u), rest = restante(u);
  const manta = k === 'manta', cs = manta ? cortesOf(u) : [], sb = manta ? sobras(u) : [];
  const mantaBody = () => `<div class="sep"></div>
    ${cs.length ? desenho(u, p?.cor) : ''}
    ${sb.length ? `<div class="pcs"><h4>Pedaços sobrando</h4>${sb.map(r => `<div class="pc"><span class="mono">${medida(r)}</span><span class="muted small">comprimento × largura</span></div>`).join('')}</div>` : ''}
    ${st === 'acabou' ? '' : `<form class="inline" id="fCorte" novalidate>${dimsField('Cortar um tapete desta manta')}<button class="btn btn-primary" type="submit">Ver onde cortar</button></form>`}
    ${cs.length ? `<details class="pcs"><summary class="small">Cortes feitos (${cs.length})</summary>${cs.map((c, i) => `<div class="pc"><span class="mono">${medida(c)}</span><span class="muted small">${c.data ? fDate(c.data) : ''}</span>${st === 'acabou' ? '' : `<button class="link" data-u="desfazer" data-i="${i}">Desfazer</button>`}</div>`).join('')}</details>` : ''}
    ${st === 'fechada' ? `<div class="row"><button class="btn" data-u="abrir">Marcar como aberta</button></div>` : ''}`;
  const tintaBody = () => `<div class="sep"></div>
    <form class="inline" id="fUso" novalidate><label class="field"><span>Usei quanto? (${K.un})</span><input class="input mono" name="v" inputmode="decimal" placeholder="2,00" autocomplete="off"></label><button class="btn btn-primary" type="submit">Registrar uso</button></form>
    <form class="inline" id="fRest" novalidate hidden><label class="field"><span>Quanto resta? (${K.un})</span><input class="input mono" name="v" inputmode="decimal" value="${f2(rest)}" autocomplete="off"></label><button class="btn" type="submit">Salvar</button></form>
    <div class="row">${st === 'fechada' ? `<button class="btn" data-u="abrir">Marcar como aberto</button>` : ''}<button class="link" data-u="corrigir">Corrigir quanto resta</button></div>`;
  const body = `<div class="big" style="--c:${labelColor(p?.cor)}">${unitIcon(k, p?.cor, rest / u.capacidade, st)}<div class="info">
      <div class="row">${pill(k, st)}<span class="muted small">entrada ${fDate(u.entrada)}</span></div>
      <div class="rest">${st === 'acabou' ? 'Acabou' : st === 'fechada' ? `${K.f ? 'Lacrada' : 'Lacrado'}, 100%: ${qty(u.capacidade, k)}` : `Usou ${qty(u.capacidade - rest, k)} · resta ${qty(rest, k)}`}</div>
      <span class="bar"><i style="width:${st === 'acabou' ? 0 : (rest / u.capacidade * 100).toFixed(1)}%"></i></span>
      ${st === 'aberta' ? `<span class="muted small">${manta ? `resta ${qty(rest, k)} de rolo inteiro${sb.length ? ` + ${sb.length} pedaço${sb.length > 1 ? 's' : ''} sobrando` : ''}` : `de ${qty(u.capacidade, k)} do balde`}</span>` : ''}</div></div>
    ${st === 'acabou' ? `<p class="muted small">${K.f ? 'Esta manta acabou' : 'Este balde acabou'} e não conta mais no estoque.</p>` : ''}
    ${manta ? mantaBody() : st === 'acabou' ? '' : tintaBody()}`;
  const foot = st === 'acabou'
    ? `<button class="btn btn-ghost-danger" data-u="excluir">Excluir</button><button class="btn" data-u="voltar">Voltar para o estoque</button>`
    : `<button class="btn btn-ghost-danger" data-u="excluir">Excluir</button><button class="btn" data-u="acabou">${K.f ? 'Acabou esta manta' : 'Acabou este balde'}</button>`;
  const d = modal({ title: `${K.Um} <span class="mono">${esc(u.codigo)}</span> · ${esc(p?.nome || '')}`, body, foot, onOpen: d => d.querySelector('#fUso input')?.focus() });
  const done = msg => { d.close(); toast(msg); };
  d.querySelector('#fUso')?.addEventListener('submit', async e => {
    e.preventDefault();

    e.preventDefault();

    const usado = r3(u.capacidade - v);

      if (c && await write(() => store.update('unidades', u.id, { cortes: novos, usado: fimCortes(novos), aberta: true, esgotada: false }))) { dlgUnidade(u.id); toast(`Corte ${medida(c)} desfeito.`); }
    }
    else if (a === 'corrigir') { d.querySelector('#fRest').hidden = false; d.querySelector('#fRest input').select(); }
    else if (a === 'abrir') { if (await write(() => store.update('unidades', u.id, { aberta: true }))) done(`${u.codigo} ${K.f ? 'aberta' : 'aberto'}.`); }
    else if (a === 'acabou') { if (await write(() => store.update('unidades', u.id, { esgotada: true, aberta: true, usadoAntes: u.usado || 0, usado: u.capacidade }))) done(`${u.codigo} saiu do estoque.`); }
    else if (a === 'voltar') { if (await write(() => store.update('unidades', u.id, { esgotada: false, usado: Math.min(u.usadoAntes || 0, r3(u.capacidade - 0.01)) }))) done(`${u.codigo} voltou para o estoque.`); }
    else if (a === 'excluir') {
      const b = e.target.closest('[data-u]');
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Confirmar exclusão'; b.className = 'btn btn-danger'; dlgErr(`Excluir apaga ${K.f ? 'a manta' : 'o balde'} ${u.codigo} de vez. Use só para lançamento feito por engano.`); return; }
      if (await write(() => store.del('unidades', u.id))) done(`${u.codigo} excluído.`);
    }
  });
}

const DIMS_ERR = 'Digite as duas medidas do tapete, em metros. Ex.: 1,00 × 0,60.';
const dimsField = (label, a = '', b = '') => `<label class="field"><span>${label}</span><span class="dims"><input class="input mono" name="a" inputmode="decimal" placeholder="1,00" value="${a}" autocomplete="off" aria-label="Comprimento (m)"><b>×</b><input class="input mono" name="b" inputmode="decimal" placeholder="0,60" value="${b}" autocomplete="off" aria-label="Largura (m)"><span class="muted">m</span></span></label>`;
function lerDims(f) { const a = num(f.a.value), b = num(f.b.value); return a > 0 && b > 0 && a <= 100 && b <= 100 ? [r3(a), r3(b)] : null; }

/* Corte de um tapete: acha a melhor manta da cor e o lugar dentro dela, mostra no desenho e registra. */
function dlgCorte(pid, a, b, prefId) {
  const p = prodById(pid); if (!p) return;
  const tam = `${f2(a)} × ${f2(b)} m`;
  const opts = unitsOf(pid).filter(u => !u.esgotada).map(u => {
    const list = encaixes(u, a, b); if (!list.length) return null;
    const fit = list[0], alt = list.find(c => Math.abs(c.w - fit.w) > EPS);
    return { u, fit, alt, key: [...fit.key.slice(0, 2), estado(u) === 'fechada' ? 1 : 0, fit.gasto, restante(u)] };
  }).filter(Boolean).sort((x, y) => cmpKey(x.key, y.key) || String(x.u.codigo).localeCompare(String(y.u.codigo)));
  if (!opts.length) {
    const largo = Math.min(a, b) > LARG + EPS;
    modal({ title: `Cortar ${tam}`, body: `<p>${largo ? `Esse tapete é mais largo que a manta (${f2(LARG)} m) nos dois lados, então não sai de um rolo só.` : `Não cabe em nenhuma ${esc(p.nome)} em estoque.`}</p>`,
      foot: `<button class="btn" data-close>Fechar</button>${largo ? '' : `<button class="btn btn-primary" data-close data-addunit="${pid}">Adicionar manta</button>`}` });
    return;
  }
  let sel = opts.find(o => o.u.id === prefId) || opts[0], girado = false;
  const naoCabe = prefId && sel.u.id !== prefId ? S.unidades.find(x => x.id === prefId)?.codigo : null;
  const d = modal({
    title: `Cortar ${tam} · ${esc(p.nome)}`,
    body: `${naoCabe ? `<div class="notice">Não cabe na ${esc(naoCabe)}. Veja a melhor opção abaixo.</div>` : ''}
      ${opts.length > 1 ? `<label class="field"><span>Manta</span><select class="input" id="cutU">${opts.map(o => `<option value="${o.u.id}"${o === sel ? ' selected' : ''}>${esc(o.u.codigo)} · ${word('manta', estado(o.u))} · ${o.fit.gasto > EPS ? `avança ${f2(o.fit.gasto)} m no rolo` : 'sai da sobra'}</option>`).join('')}</select></label>` : ''}
      <div id="cutView"></div>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-c="ok">Confirmar corte</button>`,
  });
  const view = () => {
    const f = girado && sel.alt ? sel.alt : sel.fit, cod = esc(sel.u.codigo);
    const onde = f.gasto <= EPS ? `Sai de um pedaço que sobrou na <b>${cod}</b>, sem avançar no rolo.`
      : estado(sel.u) === 'fechada' ? `Abre a <b>${cod}</b> (lacrada) e usa ${f2(f.gasto)} m do rolo.` : `Usa mais ${f2(f.gasto)} m do rolo da <b>${cod}</b>.`;
    const marca = f.x <= EPS && f.y <= EPS ? 'No começo do rolo, encostado na borda.'
      : `${f.y <= EPS ? 'No começo do rolo' : `Marque a ${f2(f.y)} m do começo do rolo`}${f.x > EPS ? `, a ${f2(f.x)} m da borda` : ', encostado na borda'}.`;
    d.querySelector('#cutView').innerHTML = `<p>${onde}</p>${desenho(sel.u, p.cor, f)}
      <p class="small"><span class="pill hot">tapete ${medida(f)}</span> ${marca}</p>
      ${sel.alt ? `<button type="button" class="link" data-c="girar">Girar o tapete</button>` : ''}`;
  };
  view();
  d.querySelector('#cutU')?.addEventListener('change', e => { sel = opts.find(o => o.u.id === e.target.value) || sel; girado = false; view(); });
  d.firstElementChild.addEventListener('click', async e => {
    const c = e.target.closest('[data-c]')?.dataset.c; if (!c) return;
    if (c === 'girar') { girado = !girado; view(); return; }
    const f = girado && sel.alt ? sel.alt : sel.fit, u = sel.u;
    const novos = [...cortesOf(u), { x: f.x, y: f.y, w: f.w, h: f.h, data: new Date().toISOString() }], fim = fimCortes(novos);
    const acabou = fim >= u.capacidade - EPS && !sobrasDe(largura(u), u.capacidade, novos).length;
    if (await write(() => store.update('unidades', u.id, { cortes: novos, usado: fim, aberta: true, esgotada: acabou, ...(acabou ? { usadoAntes: fim } : {}) }))) {
      d.close(); toast(`Corte ${medida(f)} registrado na ${u.codigo}.${acabou ? ' A manta acabou.' : ''}`);
    }
  });
}
document.addEventListener('click', e => { const b = e.target.closest('[data-addunit]'); if (b) setTimeout(() => dlgAdicionar(b.dataset.addunit)); });

function dlgAdicionar(pid) {
  const p = prodById(pid); if (!p) return;
  const k = p.tipo || 'manta', K = KIND[k];
  const d = modal({
    title: `Adicionar ${K.umas} · ${esc(p.nome)}`,
    body: `<form id="fAdd" novalidate class="dlg-form" style="display:flex;flex-direction:column;gap:12px">
      <div class="grid2"><label class="field"><span>Quantidade</span><input class="input mono" name="qtd" inputmode="numeric" value="1"></label>
      <label class="field"><span>${K.capLabel}</span><input class="input mono" name="cap" inputmode="decimal" value="${f2(p.capPadrao || K.capDef)}"></label></div>
      <label class="field"><span>Data de entrada</span><input class="input" type="date" name="data" value="${new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}"></label>
      <small class="muted">Cada ${K.um} recebe um código (${K.prefix}-001, ${K.prefix}-002…). Escreva o código na etiqueta.</small></form>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" form="fAdd" type="submit">Adicionar</button>`,
    onOpen: d => d.querySelector('[name=qtd]').select(),
  });
  d.querySelector('#fAdd').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, qtdN = Math.round(num(f.qtd.value)), cap = num(f.cap.value);
    if (!(qtdN >= 1 && qtdN <= 50)) return dlgErr('Informe uma quantidade entre 1 e 50.');
    if (!(cap > 0 && cap <= 1000)) return dlgErr(`${K.capLabel}: valor inválido.`);
    const data = f.data.value ? new Date(f.data.value + 'T12:00:00').toISOString() : new Date().toISOString();
    let n = maxCode(K.prefix, S.unidades); const codes = [];
    const ok = await write(async () => {
      for (let i = 0; i < qtdN; i++) { const c = code(K.prefix, ++n); codes.push(c); await store.set('unidades', uid(), { tipo: k, produtoId: p.id, codigo: c, capacidade: r3(cap), usado: 0, aberta: false, esgotada: false, entrada: data }); }
    });
    if (ok) { d.close(); toast(qtdN === 1 ? `${K.Um} ${codes[0]} adicionad${K.f ? 'a' : 'o'}.` : `${qtdN} ${K.umas} adicionad${K.f ? 'a' : 'o'}s: ${codes[0]} a ${codes[codes.length - 1]}.`); }
  });
}

function dlgProduto(pid, tipo) {
  const p = pid ? prodById(pid) : null, k = p?.tipo || tipo, K = KIND[k];
  const tem = p && unitsOf(p.id).length > 0;
  let fotoVal = p?.foto || '';
  const d = modal({
    title: p ? `Editar ${esc(p.nome)}` : K.addCor,
    body: `<form id="fProd" novalidate style="display:flex;flex-direction:column;gap:12px">
      <div class="photo" id="fotoPrev">${foto(p || { tipo: k, cor: '#9A9DA3' })}</div>
      <div class="row"><button type="button" class="btn" data-p="foto">${fotoVal ? 'Trocar foto' : 'Enviar foto'}</button><button type="button" class="btn btn-ghost-danger" data-p="semfoto"${fotoVal ? '' : ' hidden'}>Remover foto</button></div>
      <label class="field"><span>Nome</span><input class="input" name="nome" maxlength="80" value="${esc(p?.nome || '')}" placeholder="${k === 'manta' ? 'Ex.: Manta Azul Royal' : 'Ex.: Tinta Branca Acrílica'}"></label>
      <div class="grid2"><label class="field"><span>Cor</span><input class="input" type="color" name="cor" value="${esc(p?.cor || '#9A9DA3')}"></label>
      <label class="field"><span>${K.capLabel}</span><input class="input mono" name="cap" inputmode="decimal" value="${f2(p?.capPadrao || K.capDef)}"></label></div>
      <label class="field"><span>Posição na lista</span><input class="input mono" name="ordem" inputmode="numeric" value="${p?.ordem ?? ''}" placeholder="1, 2, 3…"></label>
      ${p && !tem ? `<button type="button" class="link" data-p="excluir" style="align-self:flex-start;color:var(--bad)">Excluir ${k === 'manta' ? 'esta cor' : 'esta tinta'}</button>` : ''}</form>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" form="fProd" type="submit">Salvar</button>`,
    onOpen: d => { if (!p) d.querySelector('[name=nome]').focus(); },
  });
  const f = d.querySelector('#fProd');
  const prev = () => { $('#fotoPrev').innerHTML = fotoVal ? `<img src="${fotoVal}" alt="">` : unitIcon(k, f.cor.value, 1, 'fechada'); d.querySelector('[data-p=semfoto]').hidden = !fotoVal; };
  f.cor.addEventListener('input', () => { if (!fotoVal) prev(); });
  dlgProduto.onFoto = url => { fotoVal = url; prev(); };
  d.firstElementChild.addEventListener('click', async e => {
    const a = e.target.closest('[data-p]')?.dataset.p; if (!a) return;
    if (a === 'foto') $('#fotoFile').click();
    else if (a === 'semfoto') { fotoVal = ''; prev(); }
    else if (a === 'excluir') {
      const b = e.target.closest('[data-p]');
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Clique de novo para confirmar a exclusão'; return; }
      if (await write(() => store.del('produtos', p.id))) { d.close(); toast(`${p.nome} excluída.`); go(K.tab); }
    }
  });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const nome = f.nome.value.trim(), cap = num(f.cap.value), ord = num(f.ordem.value);
    if (!nome) return dlgErr('Dê um nome.');
    if (S.produtos.some(x => x.id !== p?.id && x.nome.toLowerCase() === nome.toLowerCase())) return dlgErr('Já existe um item com esse nome.');
    if (!(cap > 0 && cap <= 1000)) return dlgErr(`${K.capLabel}: valor inválido.`);
    const data = { tipo: k, nome, cor: f.cor.value, foto: fotoVal, capPadrao: r3(cap), ordem: Number.isFinite(ord) ? ord : 999 };
    const id = p?.id || uid();
    const ok = await write(() => p ? store.update('produtos', id, data) : store.set('produtos', id, { ...data, criado: new Date().toISOString() }));
    if (ok) { d.close(); toast(p ? 'Salvo.' : `${nome} adicionad${k === 'manta' ? 'a' : 'a'}.`); if (!p) go('p-' + id); }
  });
}
$('#fotoFile').addEventListener('change', async e => {
  const file = e.target.files?.[0]; e.target.value = '';
  if (!file || !dlgProduto.onFoto) return;
  try { dlgProduto.onFoto(await resizeImage(file)); } catch (err) { toast('Não foi possível ler essa imagem.', 'bad'); }
});

/* ---------- páginas ---------- */
const notice = () => S.mode === 'local' ? '<div class="notice">Modo demonstração: os dados ficam só neste navegador. Para todo mundo ver o mesmo estoque, falta ligar o banco de dados (veja o LEIAME).</div>' : '';
function stockLine(p) {
  const k = p.tipo || 'manta', us = unitsOf(p.id).filter(u => !u.esgotada);
  if (!us.length) return '<i class="dot"></i>Sem estoque';
  const ab = us.filter(u => estado(u) === 'aberta').length, fe = us.length - ab;
  const parts = [];
  if (fe) parts.push(`${fe} ${word(k, 'fechada').toLowerCase()}${fe > 1 ? 's' : ''}`);
  if (ab) parts.push(`${ab} ${word(k, 'aberta').toLowerCase()}${ab > 1 ? 's' : ''}`);
  return `<i class="dot on"></i>${us.length} ${us.length > 1 ? KIND[k].umas : KIND[k].um} · ${parts.join(', ')}`;
}
function pageLista(tipo) {
  const K = KIND[tipo], q = S.ui.q[tipo];
  return `<div class="page">${notice()}
    <section class="hero"><img src="img/logo.png" alt="FJR Solutions"><h1>${K.titulo}</h1></section>
    <div class="toolbar"><input class="input search" id="q" placeholder="Buscar" value="${esc(q)}" autocomplete="off"><button class="btn btn-primary" data-act="novo" data-tipo="${tipo}">${K.addCor}</button></div>
    <div id="list">${listaHtml(tipo)}</div></div>`;
}
function listaHtml(tipo) {
  const K = KIND[tipo], q = S.ui.q[tipo].trim().toLowerCase();
  const all = prodsOf(tipo);
  if (!all.length) return tipo === 'manta' && !S.config.catalogoCriado ? '<div class="loading">Montando o catálogo…</div>'
    : `<div class="empty"><b>Nenhum${tipo === 'manta' ? 'a cor' : 'a tinta'} cadastrad${'a'}</b><p>${tipo === 'tinta' ? 'Cadastre cada tinta que vocês usam. Depois adicione os baldes dela.' : ''}</p><button class="btn btn-primary" data-act="novo" data-tipo="${tipo}">${K.addCor}</button></div>`;
  const list = all.filter(p => !q || p.nome.toLowerCase().includes(q));
  if (!list.length) return '<div class="empty"><b>Nada encontrado</b><p>Tente outro nome.</p></div>';
  return `<div class="grid">${list.map(p => `<a class="pcard" href="#p-${p.id}" style="--c:${labelColor(p.cor)}"><div class="pic">${foto(p)}</div><div class="pname">${esc(p.nome)}</div><div class="pstock">${stockLine(p)}</div></a>`).join('')}</div>`;
}
function pageProduto(id) {
  const p = prodById(id);
  if (!p) return `<div class="page"><div class="empty"><b>Item não encontrado</b><p>Pode ter sido excluído.</p><a class="btn" href="#mantas">Voltar</a></div></div>`;
  const k = p.tipo || 'manta', K = KIND[k], c = labelColor(p.cor);
  const all = unitsOf(id), ativos = all.filter(u => !u.esgotada), acabados = all.filter(u => u.esgotada);
  const ord = { aberta: 0, fechada: 1 };
  ativos.sort((a, b) => ord[estado(a)] - ord[estado(b)] || String(a.codigo).localeCompare(String(b.codigo)));
  const ab = ativos.filter(u => estado(u) === 'aberta'), fe = ativos.length - ab.length;
  const card = u => {
    const st = estado(u), rest = restante(u), n = k === 'manta' && st !== 'acabou' ? sobras(u).length : 0;
    const info = st === 'aberta' ? `<span class="sub">usou <b>${qty(u.capacidade - rest, k)}</b></span><span class="sub">resta ${qty(rest, k)}</span>`
      : st === 'fechada' ? `<span class="sub">${qty(u.capacidade, k)} · 100%</span>` : '<span class="sub">fora do estoque</span>';
    return `<button class="unit${st === 'acabou' ? ' done' : ''}" data-unit="${u.id}" style="--c:${c}">${unitIcon(k, p.cor, rest / u.capacidade, st)}<span class="code">${esc(u.codigo)}</span>${pill(k, st)}${info}${n ? `<span class="pcs-tag">${n} pedaço${n > 1 ? 's' : ''} sobrando</span>` : ''}</button>`;
  };
  return `<div class="page">${notice()}
    <div class="ph" style="--c:${c}"><a class="back" href="#${K.tab}" aria-label="Voltar">${backIcon}</a><h1>${esc(p.nome)}</h1><div class="acts"><button class="btn" data-act="editar" data-id="${id}">Editar</button></div></div>
    <div class="summary"><span class="pill ok">${ativos.length} em estoque</span>${fe ? `<span class="pill closed">${fe} ${word(k, 'fechada').toLowerCase()}${fe > 1 ? 's' : ''}</span>` : ''}${ab.length ? `<span class="pill hot">${ab.length} ${word(k, 'aberta').toLowerCase()}${ab.length > 1 ? 's' : ''}</span>` : ''}</div>
    ${k === 'manta' && ativos.length ? `<form class="order" id="fPedido" novalidate>${dimsField('Novo tapete: o site acha a melhor manta e onde cortar')}<button class="btn btn-primary" type="submit">Ver onde cortar</button></form>` : ''}
    <div class="units">${ativos.map(card).join('')}<button class="unit add" data-act="adicionar" data-id="${id}"><b>+</b>Adicionar ${K.um}</button></div>
    ${acabados.length ? `<div><button class="link" data-act="acabadas">${S.ui.acabadas ? 'Esconder' : 'Mostrar'} ${acabados.length} que acabar${acabados.length > 1 ? 'am' : 'ou'}</button></div>${S.ui.acabadas ? `<div class="units">${acabados.map(card).join('')}</div>` : ''}` : ''}
  </div>`;
}

/* ---------- navegação ---------- */
function parse(h) {
  const m = (h || '').match(/^p-(.+)$/);
  if (m) return { page: 'produto', id: m[1] };
  return { page: 'lista', tipo: h === 'tintas' ? 'tinta' : 'manta' };
}
function go(h) {
  try { if (location.hash.slice(1) !== h) history.pushState(null, '', '#' + h); } catch (e) { location.hash = h; }
  S.route = parse(h); S.ui.acabadas = false; render(true); window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { S.route = parse(location.hash.slice(1)); render(true); });
window.addEventListener('hashchange', () => { S.route = parse(location.hash.slice(1)); render(true); });
let tmr = 0;
function scheduleRender() { if (tmr) return; tmr = setTimeout(() => { tmr = 0; if (ready()) seedCatalogo(); render(); }, 16); }
function render(force) {
  const r = S.route, tipo = r.page === 'produto' ? (prodById(r.id)?.tipo || 'manta') : r.tipo;
  document.querySelectorAll('.navs .nav').forEach(a => { if (a.dataset.nav === tipo) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#mode').innerHTML = S.mode === 'firebase' ? '<i class="dot on"></i><span>Online</span>' : S.mode === 'local' ? '<i class="dot local"></i><span>Demonstração</span>' : '<i class="dot"></i><span>Conectando…</span>';
  const el = $('#app');
  if (!ready()) { el.innerHTML = '<div class="loading">Carregando…</div>'; return; }
  const ae = document.activeElement;
  if (!force && ae && el.contains(ae) && ae.id === 'q') { $('#list').innerHTML = listaHtml(r.tipo); return; }
  const fp = $('#fPedido'), keep = fp && [fp.a.value, fp.b.value, fp.contains(ae) ? ae.name : null];
  el.innerHTML = r.page === 'produto' ? pageProduto(r.id) : pageLista(r.tipo);
  const np = $('#fPedido');
  if (keep && np) { np.a.value = keep[0]; np.b.value = keep[1]; if (keep[2]) np[keep[2]].focus(); }
}

/* ---------- eventos ---------- */
document.addEventListener('submit', e => {
  if (e.target.id !== 'fPedido') return;
  e.preventDefault();
  const m = lerDims(e.target); if (!m) return toast(DIMS_ERR, 'bad');
  dlgCorte(S.route.id, m[0], m[1]);
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.ui.q[S.route.tipo] = e.target.value; $('#list').innerHTML = listaHtml(S.route.tipo); } });
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#dlg')) return;
  const a = t.closest('a[href^="#"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href').slice(1)); return; }
  const u = t.closest('[data-unit]');
  if (u) { dlgUnidade(u.dataset.unit); return; }
  const b = t.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'novo') dlgProduto(null, b.dataset.tipo);
  else if (act === 'editar') dlgProduto(b.dataset.id);
  else if (act === 'adicionar') dlgAdicionar(b.dataset.id);
  else if (act === 'acabadas') { S.ui.acabadas = !S.ui.acabadas; render(true); }
});

/* ---------- início ---------- */
async function boot() {
  S.route = parse(location.hash.slice(1)); render(true);
  const conf = window.FJR_FIREBASE;
  if (conf && conf.apiKey) {
    try { store = await firebaseStore(conf); S.mode = 'firebase'; }
    catch (e) { console.error(e); store = localStore(); S.mode = 'local'; toast('Não foi possível conectar ao banco de dados. Usando modo demonstração.', 'bad'); }
  } else { store = localStore(); S.mode = 'local'; }
  for (const col of COLS) {
    store.sub(col, list => {
      if (col === 'config') { const g = list.find(d => d.id === 'geral'); const { id, ...rest } = g || {}; S.config = rest; }
      else S[col] = list;
      S.loaded.add(col); scheduleRender();
    }, err => { console.error(err); S.loaded.add(col); toast('Não foi possível ler o estoque. Confira as regras do Firestore.', 'bad'); scheduleRender(); });
  }
}
boot();
})();
</script>
</body>
